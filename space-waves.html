<!DOCTYPE html>
<!-- Ultimate Game Stash file-->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->
<html lang="en-us">
<head>
  <!-- These two must come BEFORE <base> so they resolve to the local server, not the CDN -->
  <script src="./cover-profiles.js"></script>
  <script defer src="./music-bridge.js"></script>
  <link rel="icon" type="image/png" href="./clever1.png">

  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@d84a892372bc6e836fafbd784d9c12f83071b9e3/space%20waves/">

  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Waves</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.json">
  <style>
    /* ── alex.fun chrome variables ── */
    :root {
      --status-h: 24px;
      --panel: rgba(0, 8, 20, .82);
      --fg: #f0f9ff;
      --border: rgba(144,224,239,.22);
    }

    /* Reserve room for the status bar */
    #unity-container,
    #loading-cover {
      bottom: var(--status-h) !important;
      height: calc(100% - var(--status-h)) !important;
    }

    /* ── Cover overlay (Backspace / click to toggle) ── */
    #alexCoverOverlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
    }
    #alexCoverOverlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    #alexCoverOverlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ── Top bar ── */
    .alex-topbar {
      position: fixed;
      top: 10px; left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      z-index: 9000;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .alex-actions { display: flex; gap: 8px; pointer-events: auto; }
    .alex-title {
      pointer-events: none;
      max-width: 44vw;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 22px rgba(0,0,0,.32);
      font-size: 12px;
      font-weight: 900;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .alex-btn {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--fg);
      padding: 8px 12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 22px rgba(0,0,0,.32);
    }
    .alex-btn:hover { background: rgba(0,29,61,.92); }

    /* ── Status bar ── */
    #alexStatusBar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--status-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: #000c1a;
      border-top: 1px solid rgba(144,224,239,.14);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: #90e0ef;
      z-index: 9100;
    }
    #alexStatusBar .sb-cover { cursor: pointer; user-select: none; }
    #alexStatusBar .sb-cover:hover { color: var(--fg); }

    @media (max-width: 640px) {
      .alex-topbar { top: 8px; left: 8px; right: 8px; }
      .alex-title { display: none; }
      .alex-btn { padding: 7px 10px; }
    }
  </style>
</head>
<body class="noselect">

  <!-- ── alex.fun top bar ── -->
  <div class="alex-topbar">
    <div class="alex-actions">
      <button class="alex-btn" id="alexBackBtn" type="button">Back</button>
    </div>
    <div class="alex-title">Space Waves</div>
    <div class="alex-actions">
      <button class="alex-btn" id="alexFullscreenBtn" type="button">Fullscreen</button>
    </div>
  </div>

  <!-- ── Game container (original) ── -->
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.png"></div>
      <br><br><br>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- ── Cover overlay ── -->
  <div id="alexCoverOverlay" aria-hidden="true">
    <img data-cover-image alt="Cover">
  </div>

  <!-- ── alex.fun status bar ── -->
  <div id="alexStatusBar">
    <span>Space Waves</span>
    <span class="sb-cover" id="alexCoverHint">Backspace Cover Image</span>
  </div>

  <script src="microsoftDataMigrationDO.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      microsoftMigration();
    });

    window.addEventListener("PlayerPrefsReady", () => {
      migratePlayerPrefs();
    });
  </script>

  <script>
    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js");
      }
    });

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/dae5c7bd2b15915f51ae4e56b8f5367d.loader.js";
    const config = {
      dataUrl: buildUrl + "/568ea6b3af616bd57f419c508c933303.data.unityweb",
      frameworkUrl: buildUrl + "/c699bc4c24abfbdb4c8b3e15b0af7d3f.framework.js.unityweb",
      codeUrl: buildUrl + "/7fb5141de5923189bc1dc5f94eb619f2.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "do.Games",
      productName: "Space Waves",
      productVersion: "1.1.2-ms",
      matchWebGLToCanvasSize: "false"
    };

    loadingCover.style.display = "";

    var needMigrate = false;
    var gameInstance;
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        console.log("<do.G> Unity inited");
        gameInstance = unityInstance;
        loadingCover.style.display = "none";
        resizeCanvas();
        loadAds();

        if (needMigrate) {
          needMigrate = false;
          gameInstance.SendMessage('MSStartSDK', 'OnMigratePlayerPrefs', window["fetchPlayerPrefs"]);
        }

      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);

    // Focus
    function setFocus() {
      container.focus();
      window.focus();
      canvas.focus();
    }

    window.addEventListener("touchstart", () => { setFocus(); });
    window.addEventListener("pointerdown", () => { setFocus(); });
    window.addEventListener("resize", () => { setFocus(); resizeCanvas(); });

    function resizeCanvas() {
      var pixelRatio = window.devicePixelRatio || 1;
      var width = canvas.clientWidth * pixelRatio;
      var height = canvas.clientHeight * pixelRatio;

      if (canvas.width != width || canvas.height != height) {
        if (height > 1080) {
          canvas.width = Math.floor(width / height * 1080);
          canvas.height = 1080;
        } else {
          canvas.width = width;
          canvas.height = height;
        }
      }
    }

    function migratePlayerPrefs() {
      if (typeof gameInstance !== 'undefined') {
        gameInstance.SendMessage('MSStartSDK', 'OnMigratePlayerPrefs', window["fetchPlayerPrefs"]);
      } else {
        needMigrate = true;
      }
    }
  </script>

  <script src="msstart-v1.0.0-rc.13.min.js"></script>

  <script>
    var _interstitialAdInstance = null;
    var _rewardedAdInstance = null;

    function loadAds() {
      loadInterstitialAd();
      loadRewardedAd();
    }

    function loadInterstitialAd() {
      _interstitialAdInstance = null;

      $msstart.loadAdsAsync().then(adInstance => {
        _interstitialAdInstance = adInstance;
        console.log("Interstitial ad successfully loaded!");
      }).catch(e => {
        console.error('<do.G> Error loading interstitial ad. Will retry in 20 seconds...', e);
        setTimeout(loadInterstitialAd, 20000);
      });
    }

    function loadRewardedAd() {
      _rewardedAdInstance = null;

      $msstart.loadAdsAsync(true).then(adInstance => {
        _rewardedAdInstance = adInstance;
        console.log("Rewarded ad successfully loaded!");
      }).catch(e => {
        console.error('<do.G> Error loading rewarded ad. Will retry in 20 seconds...', e);
        setTimeout(loadRewardedAd, 20000);
      });
    }

    async function showInterstitialAd() {
      if (_interstitialAdInstance == null) {
        gameInstance.SendMessage('MSStartSDK', 'OnInterstitialAdShowError');
        return;
      }

      let t;

      try {
        t = await $msstart.showAdsAsync(_interstitialAdInstance.instanceId);
      } catch (e) {
        console.error('<do.G> Error show interstitial ad: ', e);
        gameInstance.SendMessage('MSStartSDK', 'OnInterstitialAdShowError');
        loadInterstitialAd();
      }

      if (t) {
        try {
          await t.showAdsCompletedAsync;
          gameInstance.SendMessage('MSStartSDK', 'OnInterstitialAdClose');
          loadInterstitialAd();
        } catch (e) {
          console.error('<do.G> Error interstitial showAdsCompletedAsync: ', e);
          gameInstance.SendMessage('MSStartSDK', 'OnInterstitialAdShowError');
          loadInterstitialAd();
        }
      }
    }

    async function showRewardedAd() {
      if (_rewardedAdInstance == null) {
        gameInstance.SendMessage('MSStartSDK', 'OnRewardedAdShowError');
        return;
      }

      let t;

      try {
        t = await $msstart.showAdsAsync(_rewardedAdInstance.instanceId);
      } catch (e) {
        console.error('<do.G> Error show rewarded ad: ', e);
        gameInstance.SendMessage('MSStartSDK', 'OnRewardedAdShowError');
        loadRewardedAd();
      }

      if (t) {
        try {
          await t.showAdsCompletedAsync;
          gameInstance.SendMessage('MSStartSDK', 'OnReward');
          loadRewardedAd();
        } catch (e) {
          console.error('<do.G> Error rewarded showAdsCompletedAsync: ', e);
          gameInstance.SendMessage('MSStartSDK', 'OnRewardedAdShowError');
          loadRewardedAd();
        }
      }
    }
  </script>

  <!-- ── alex.fun chrome JS ── -->
  <script>
    // Back button — location.href is always the real page URL, unaffected by <base>
    document.getElementById('alexBackBtn').addEventListener('click', () => {
      location.href = new URL('index.html', location.href).href;
    });

    // Fullscreen
    const alexFullscreenBtn = document.getElementById('alexFullscreenBtn');
    alexFullscreenBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          alexFullscreenBtn.textContent = 'Exit Fullscreen';
        } else {
          await document.exitFullscreen();
          alexFullscreenBtn.textContent = 'Fullscreen';
        }
      } catch (e) {
        console.log('Fullscreen failed:', e);
      }
    });
    document.addEventListener('fullscreenchange', () => {
      alexFullscreenBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    });

    // Cover overlay (Backspace or click to toggle)
    const alexCoverOverlay = document.getElementById('alexCoverOverlay');

    function alexToggleCover() {
      const showing = alexCoverOverlay.classList.toggle('show');
      alexCoverOverlay.setAttribute('aria-hidden', String(!showing));
    }
    // Clicking the overlay itself hides it
    alexCoverOverlay.addEventListener('click', alexToggleCover);

    document.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        alexToggleCover();
      }
    });
    document.getElementById('alexCoverHint').addEventListener('click', alexToggleCover);
  </script>

</body>
</html>
