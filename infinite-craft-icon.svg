<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f5f2ed"/>
      <stop offset="100%" stop-color="#e8e4dd"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="940" height="400" fill="url(#bg)"/>

  <!-- Dot grid -->
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="1.2" fill="#c8c4be" opacity="0.5"/>
  </pattern>
  <rect width="940" height="400" fill="url(#dots)"/>

  <!-- Gradient overlay left -->
  <rect width="220" height="400" fill="url(#bg)" opacity="0.7"/>
  <!-- Gradient overlay right -->
  <rect x="720" width="220" height="400" fill="url(#bg)" opacity="0.7"/>

  <!-- ── Element tiles ── -->
  <!-- Earth tile -->
  <g filter="url(#shadow)">
    <rect x="180" y="130" width="130" height="54" rx="12" fill="white" stroke="#e0ddd8" stroke-width="1.5"/>
    <text x="200" y="165" font-family="Arial" font-size="22">🌍</text>
    <text x="228" y="165" font-family="'Nunito','Arial',sans-serif" font-size="14" font-weight="800" fill="#1a1a1a">Earth</text>
  </g>

  <!-- Fire tile -->
  <g filter="url(#shadow)">
    <rect x="180" y="216" width="130" height="54" rx="12" fill="white" stroke="#e0ddd8" stroke-width="1.5"/>
    <text x="200" y="251" font-family="Arial" font-size="22">🔥</text>
    <text x="228" y="251" font-family="'Nunito','Arial',sans-serif" font-size="14" font-weight="800" fill="#1a1a1a">Fire</text>
  </g>

  <!-- Plus sign -->
  <text x="326" y="200" text-anchor="middle" font-family="'Arial Black',Arial" font-size="28" font-weight="900" fill="#ccc">+</text>

  <!-- Arrow -->
  <line x1="395" y1="200" x2="475" y2="200" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="480,200 468,193 468,207" fill="#ccc"/>

  <!-- Result tile: Lava -->
  <g filter="url(#shadow)">
    <rect x="488" y="173" width="165" height="54" rx="12" fill="white" stroke="#e0ddd8" stroke-width="2"/>
    <text x="508" y="208" font-family="Arial" font-size="22">🌋</text>
    <text x="536" y="208" font-family="'Nunito','Arial',sans-serif" font-size="14" font-weight="800" fill="#1a1a1a">Lava</text>
  </g>

  <!-- Sparkle around result -->
  <text x="665" y="175" font-size="14" font-family="Arial" opacity="0.7">✨</text>
  <text x="680" y="220" font-size="11" font-family="Arial" opacity="0.5">✦</text>
  <text x="655" y="235" font-size="10" font-family="Arial" opacity="0.4">✦</text>

  <!-- Top-left: Water tile -->
  <g filter="url(#shadow)" opacity="0.45">
    <rect x="55" y="80" width="115" height="46" rx="10" fill="white" stroke="#e0ddd8" stroke-width="1.5"/>
    <text x="70" y="112" font-family="Arial" font-size="19">💧</text>
    <text x="95" y="111" font-family="'Nunito','Arial',sans-serif" font-size="12" font-weight="800" fill="#1a1a1a">Water</text>
  </g>

  <!-- Bottom-right: Cloud tile -->
  <g filter="url(#shadow)" opacity="0.4">
    <rect x="745" y="280" width="120" height="46" rx="10" fill="white" stroke="#e0ddd8" stroke-width="1.5"/>
    <text x="760" y="312" font-family="Arial" font-size="19">☁️</text>
    <text x="785" y="311" font-family="'Nunito','Arial',sans-serif" font-size="12" font-weight="800" fill="#1a1a1a">Cloud</text>
  </g>

  <!-- Bottom-left: Wind tile -->
  <g filter="url(#shadow)" opacity="0.4">
    <rect x="60" y="290" width="110" height="46" rx="10" fill="white" stroke="#e0ddd8" stroke-width="1.5"/>
    <text x="74" y="321" font-family="Arial" font-size="19">💨</text>
    <text x="99" y="320" font-family="'Nunito','Arial',sans-serif" font-size="12" font-weight="800" fill="#1a1a1a">Wind</text>
  </g>

  <!-- Top-right: Dragon tile -->
  <g filter="url(#shadow)" opacity="0.38">
    <rect x="755" y="80" width="125" height="46" rx="10" fill="white" stroke="#e0ddd8" stroke-width="1.5"/>
    <text x="770" y="112" font-family="Arial" font-size="19">🐉</text>
    <text x="795" y="111" font-family="'Nunito','Arial',sans-serif" font-size="12" font-weight="800" fill="#1a1a1a">Dragon</text>
  </g>

  <!-- Drag hint -->
  <text x="328" y="330" text-anchor="middle" font-family="'Nunito','Arial',sans-serif" font-size="13" font-weight="800" fill="#bbb" letter-spacing="1">DRAG TO COMBINE</text>
</svg>
