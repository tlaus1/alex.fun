<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fff0e8"/>
    </radialGradient>
    <filter id="sh2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="940" height="400" fill="url(#bg2)"/>

  <!-- Subtle grid dots -->
  <pattern id="dots2" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="1" fill="#e8c8b0" opacity="0.5"/>
  </pattern>
  <rect width="940" height="400" fill="url(#dots2)"/>

  <!-- Center card -->
  <g filter="url(#sh2)">
    <rect x="220" y="40" width="500" height="320" rx="20" fill="white" stroke="#f0e8e0" stroke-width="1.5"/>
  </g>

  <!-- Card header -->
  <rect x="220" y="40" width="500" height="56" rx="20" fill="#1a1a1a"/>
  <rect x="220" y="72" width="500" height="24" fill="#1a1a1a"/>
  <text x="470" y="75" text-anchor="middle" font-family="'Nunito','Arial',sans-serif" font-size="15" font-weight="900" fill="white" letter-spacing="1">THE PASSWORD GAME</text>

  <!-- Password field area -->
  <rect x="248" y="112" width="444" height="44" rx="10" fill="#f8f8f8" stroke="#e8e8e8" stroke-width="1.5"/>
  <!-- Dots representing password chars -->
  <circle cx="278" cy="134" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="296" cy="134" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="314" cy="134" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="332" cy="134" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="350" cy="134" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="368" cy="134" r="5" fill="#ff5c5c" opacity="0.9"/>
  <circle cx="386" cy="134" r="5" fill="#ff5c5c" opacity="0.9"/>
  <text x="660" y="139" font-family="'Nunito',Arial" font-size="11" font-weight="800" fill="#bbb">47</text>

  <!-- Rule rows -->
  <!-- Rule 1 - passing (green) -->
  <rect x="248" y="170" width="444" height="34" rx="8" fill="#f0fdf4" stroke="#34d17a" stroke-width="1.5"/>
  <circle cx="272" cy="187" r="8" fill="#34d17a"/>
  <text x="272" y="191" text-anchor="middle" font-family="Arial" font-size="11" font-weight="900" fill="white">✓</text>
  <text x="290" y="191" font-family="'Nunito',Arial" font-size="12" font-weight="800" fill="#1a1a1a">Rule 1 · Must be at least 5 characters</text>
  <text x="648" y="191" font-family="'Nunito',Arial" font-size="11" font-weight="700" fill="#5bbf7f">✓ done</text>

  <!-- Rule 2 - passing -->
  <rect x="248" y="210" width="444" height="34" rx="8" fill="#f0fdf4" stroke="#34d17a" stroke-width="1.5"/>
  <circle cx="272" cy="227" r="8" fill="#34d17a"/>
  <text x="272" y="231" text-anchor="middle" font-family="Arial" font-size="11" font-weight="900" fill="white">✓</text>
  <text x="290" y="231" font-family="'Nunito',Arial" font-size="12" font-weight="800" fill="#1a1a1a">Rule 2 · Must include a number</text>
  <text x="648" y="231" font-family="'Nunito',Arial" font-size="11" font-weight="700" fill="#5bbf7f">✓ done</text>

  <!-- Rule 3 - failing (red) -->
  <rect x="248" y="250" width="444" height="34" rx="8" fill="#fff5f5" stroke="#ff5c5c" stroke-width="1.5"/>
  <circle cx="272" cy="267" r="8" fill="#ff5c5c"/>
  <text x="272" y="271" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900" fill="white">✕</text>
  <text x="290" y="271" font-family="'Nunito',Arial" font-size="12" font-weight="800" fill="#1a1a1a">Rule 3 · Digits must add up to 25</text>
  <text x="630" y="271" font-family="'Nunito',Arial" font-size="11" font-weight="700" fill="#e06060">sum is 18</text>

  <!-- Rule 4 - failing (just appeared) -->
  <rect x="248" y="290" width="444" height="34" rx="8" fill="#fff5f5" stroke="#ff5c5c" stroke-width="1.5"/>
  <circle cx="272" cy="307" r="8" fill="#ff5c5c"/>
  <text x="272" y="311" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900" fill="white">✕</text>
  <text x="290" y="311" font-family="'Nunito',Arial" font-size="12" font-weight="800" fill="#1a1a1a">Rule 4 · Must include a month of the year</text>

  <!-- Decorative lock icon right side -->
  <text x="800" y="195" font-family="Arial" font-size="64" opacity="0.07">🔒</text>

  <!-- Progress bar -->
  <rect x="248" y="338" width="444" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="248" y="338" width="178" height="6" rx="3" fill="#34d17a"/>
  <text x="470" y="360" text-anchor="middle" font-family="'Nunito',Arial" font-size="11" font-weight="800" fill="#bbb">2 / 50 rules complete</text>
</svg>
