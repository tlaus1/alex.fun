<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Password Game — alex.fun</title>
  <link rel="icon" type="image/png" href="./clever1.png"/>
  <script src="./cover-profiles.js"></script>
  <script src="./supabase-config.js"></script>
  <script defer src="./music-bridge.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Martel Sans",Arial,sans-serif;
      background:#fafaf8;color:#1a1a1a;
      min-height:100vh;display:flex;flex-direction:column;
      padding-bottom:26px;
      animation:pageIn .32s ease both;
    }
    @keyframes pageIn{from{opacity:0}to{opacity:1}}
    [data-theme="dark"] body{background:#111;color:#ececec;}

    /* ── Top bar ── */
    .top-bar{
      display:flex;align-items:center;gap:10px;
      padding:11px 20px;background:#fff;
      border-bottom:1.5px solid #e8e8e8;flex-shrink:0;
    }
    .top-bar h1{font-size:18px;font-weight:900;flex:1;}
    [data-theme="dark"] .top-bar{background:#181818;border-bottom-color:#2a2a2a;}
    [data-theme="dark"] .top-bar h1{color:#ececec;}
    .btn{
      font-family:inherit;font-size:13px;font-weight:800;
      color:#1a1a1a;background:#fff;border:1.5px solid #d4d4d4;
      border-radius:100px;padding:7px 16px;cursor:pointer;
      transition:background .15s,border-color .15s,transform .12s;
    }
    .btn:hover{background:#f5f5f5;border-color:#bbb;transform:translateY(-1px);}
    [data-theme="dark"] .btn{color:#ececec;background:#1f1f1f;border-color:#333;}
    [data-theme="dark"] .btn:hover{background:#2a2a2a;border-color:#4a4a4a;}

    /* ── Main layout ── */
    .main{
      max-width:680px;margin:0 auto;padding:32px 20px 60px;
      width:100%;
    }

    /* ── Password field ── */
    .pw-wrap{position:relative;margin-bottom:28px;}
    .pw-label{
      font-size:13px;font-weight:800;color:#888;
      letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;
    }
    [data-theme="dark"] .pw-label{color:#9a9a9a;}
    #pwInput{
      width:100%;padding:14px 50px 14px 18px;
      font-family:inherit;font-size:17px;font-weight:800;
      border:2px solid #e0e0e0;border-radius:14px;
      background:#fff;color:#1a1a1a;outline:none;
      transition:border-color .2s,box-shadow .2s;
      line-height:1.4;
    }
    #pwInput:focus{border-color:#1a1a1a;box-shadow:0 0 0 3px rgba(0,0,0,.06);}
    [data-theme="dark"] #pwInput{
      background:#1c1c1c;color:#ececec;border-color:#333;
    }
    [data-theme="dark"] #pwInput:focus{
      border-color:#7f7f7f;box-shadow:0 0 0 3px rgba(255,255,255,.08);
    }
    .pw-len{
      position:absolute;right:16px;top:50%;transform:translateY(-50%);
      font-size:12px;font-weight:900;color:#bbb;
    }

    /* ── Rules container ── */
    .rules-title{
      font-size:13px;font-weight:900;color:#bbb;
      letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;
    }
    [data-theme="dark"] .rules-title{color:#7d7d7d;}
    #rulesContainer{display:flex;flex-direction:column;gap:10px;}

    /* ── Single rule ── */
    .rule{
      display:flex;align-items:flex-start;gap:12px;
      padding:13px 16px;border-radius:14px;
      border:1.5px solid #ebebeb;background:#fff;
      transition:border-color .2s,background .2s,opacity .3s;
      animation:ruleIn .35s ease;
    }
    [data-theme="dark"] .rule{border-color:#2f2f2f;background:#1b1b1b;}
    @keyframes ruleIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .rule.pass{border-color:#34d17a;background:#f0fdf4;}
    .rule.fail{border-color:#ff5c5c;background:#fff5f5;}
    [data-theme="dark"] .rule.pass{background:#123222;}
    [data-theme="dark"] .rule.fail{background:#361818;}
    .rule-icon{
      font-size:18px;line-height:1;flex-shrink:0;margin-top:1px;
    }
    .rule-body{flex:1;}
    .rule-num{
      font-size:11px;font-weight:900;color:#ccc;
      letter-spacing:1px;margin-bottom:2px;
    }
    [data-theme="dark"] .rule-num{color:#7f7f7f;}
    .rule.pass .rule-num{color:#aee3c0;}
    .rule.fail .rule-num{color:#ffaaaa;}
    .rule-text{font-size:14px;font-weight:800;line-height:1.45;}
    [data-theme="dark"] .rule-text{color:#ececec;}
    .rule-hint{font-size:12px;color:#888;font-weight:700;margin-top:3px;}
    [data-theme="dark"] .rule-hint{color:#a0a0a0;}
    .rule.pass .rule-hint{color:#5bbf7f;}
    .rule.fail .rule-hint{color:#e06060;}

    /* ── Win screen ── */
    #winScreen{
      display:none;text-align:center;padding:60px 20px;
    }
    #winScreen.show{display:block;}
    .win-emoji{font-size:72px;margin-bottom:16px;}
    .win-title{font-size:32px;font-weight:900;margin-bottom:8px;}
    .win-sub{font-size:16px;color:#888;font-weight:700;margin-bottom:28px;}
    [data-theme="dark"] .win-sub{color:#a0a0a0;}
    .win-pw{
      background:#f5f5f5;border-radius:12px;
      padding:14px 20px;font-size:14px;font-weight:800;
      word-break:break-all;color:#555;margin-bottom:24px;
      border:1.5px solid #e0e0e0;
    }
    [data-theme="dark"] .win-pw{
      background:#1f1f1f;color:#d3d3d3;border-color:#363636;
    }

    /* ── Progress bar ── */
    .progress-wrap{
      height:6px;background:#f0f0f0;border-radius:100px;
      margin-bottom:20px;overflow:hidden;
    }
    .progress-bar{
      height:100%;background:linear-gradient(90deg,#34d17a,#00b894);
      border-radius:100px;transition:width .4s ease;width:0%;
    }
    [data-theme="dark"] .progress-wrap{background:#2a2a2a;}

    /* ── Cover controls ── */
    #statusBar{
      position:fixed;bottom:0;left:0;right:0;height:26px;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 14px;background:#fff;border-top:1px solid #e8e8e8;
      font-size:11px;font-weight:800;color:#888;z-index:200;
      transition:background .25s,border-color .25s,color .25s;
    }
    #statusBar .sb-cover{cursor:pointer;user-select:none;}
    #statusBar .sb-cover:hover{color:#1a1a1a;}
    [data-theme="dark"] #statusBar{background:#181818;border-top-color:#2a2a2a;color:#9a9a9a;}
    [data-theme="dark"] #statusBar .sb-cover:hover{color:#ececec;}

    #coverOverlay{
      position:fixed;inset:0;z-index:9998;cursor:pointer;
      background:#fff;opacity:0;pointer-events:none;
      transition:opacity .55s cubic-bezier(.4,0,.2,1);
    }
    #coverOverlay.show{opacity:1;pointer-events:auto;}
    #coverOverlay img{
      width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="btn" onclick="location.href='./index.html'">← Back</button>
  <h1>The Password Game</h1>
  <button class="btn" id="themeToggle" title="Toggle dark mode" style="padding:7px 11px;">🌙</button>
  <button class="btn" id="resetBtn">Reset</button>
</div>

<div class="main" id="mainContent">
  <div class="pw-wrap">
    <div class="pw-label">Your Password</div>
    <input type="text" id="pwInput" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Start typing…"/>
    <span class="pw-len" id="pwLen">0</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="rules-title">Rules</div>
  <div id="rulesContainer"></div>
</div>

<div id="winScreen">
  <div class="win-emoji">🎉</div>
  <div class="win-title">You cracked it!</div>
  <div class="win-sub">All 50 rules satisfied. You're a legend.</div>
  <div class="win-pw" id="winPw"></div>
  <button class="btn" id="playAgainBtn" style="font-size:15px;padding:12px 28px;">Play Again</button>
</div>

<div id="statusBar">
  <span class="sb-cover" onclick="toggleCover()">⌫ Cover Image</span>
  <span>v1.0.0</span>
</div>

<div id="coverOverlay" onclick="hideCover()">
  <img src="./cleverpage.png" alt="Cover"/>
</div>

<script>
// ─────────────────────────────────────────────
//  Dark mode
// ─────────────────────────────────────────────
(function(){
  const saved = localStorage.getItem('theme') || 'light';
  if(saved==='dark') document.documentElement.setAttribute('data-theme','dark');
})();

function syncThemeButton(){
  const btn = document.getElementById('themeToggle');
  if(!btn) return;
  btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
}

document.getElementById('themeToggle').addEventListener('click', function(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme','light');
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    localStorage.setItem('theme','dark');
  }
  syncThemeButton();
});
syncThemeButton();

// ─────────────────────────────────────────────
//  Cover overlay
// ─────────────────────────────────────────────
function showCover(){
  document.getElementById('coverOverlay').classList.add('show');
  clearTimeout(coverTimer);
}
function hideCover(){
  document.getElementById('coverOverlay').classList.remove('show');
  armCoverTimer();
}
function toggleCover(){
  if(document.getElementById('coverOverlay').classList.contains('show')) hideCover();
  else showCover();
}
let coverTimer = null;
function isTypingField(){
  const active = document.activeElement;
  return active && active.closest("input, textarea, select, [contenteditable='true']");
}
function armCoverTimer(){
  clearTimeout(coverTimer);
  coverTimer = setTimeout(showCover, 5000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearTimeout(coverTimer);
});
function handleCoverActivity(){
  if(document.getElementById('coverOverlay').classList.contains('show')) return;
  else armCoverTimer();
}
document.addEventListener('keydown', e => {
  if(!['Backspace','Enter'].includes(e.key)){
    armCoverTimer();
    return;
  }
  if(isTypingField()){
    armCoverTimer();
    return;
  }
  e.preventDefault();
  toggleCover();
});
["mousemove","mousedown","touchstart","click","wheel","input"].forEach(evt=>{
  window.addEventListener(evt, handleCoverActivity, { passive:true });
});
armCoverTimer();

// ─────────────────────────────────────────────
//  RULE DEFINITIONS
// ─────────────────────────────────────────────
const RULES = [
  {

    check: p=>/minecraft|fortnite|roblox|tetris|mario|zelda|pok[eé]mon|halo|doom|overwatch|valorant|stardew|celeste|among us|gta|fifa|skyrim|witcher|terraria|undertale|hollow knight|cuphead|factorio|portal|half.life|counterstrike|counter.strike/i.test(p)

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let highestRule = 1; // how many rules have been revealed

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
function init(){
  highestRule = 1;
  renderRules();
  document.getElementById('pwInput').value = '';
  document.getElementById('pwLen').textContent = '0';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('winScreen').classList.remove('show');
  document.getElementById('pwInput').focus();
}

function renderRules(){
  const container = document.getElementById('rulesContainer');
  container.innerHTML = '';
  for(let i=0; i<highestRule && i<RULES.length; i++){
    const r = RULES[i];
    const div = document.createElement('div');
    div.className = 'rule';
    div.id = 'rule-'+r.id;
    div.innerHTML = `
      <div class="rule-icon">${r.icon}</div>
      <div class="rule-body">
        <div class="rule-num">RULE ${r.id}</div>
        <div class="rule-text">${r.text}</div>
        <div class="rule-hint" id="hint-${r.id}"></div>
      </div>`;
    container.appendChild(div);
  }
}

// ─────────────────────────────────────────────
//  Live validation
// ─────────────────────────────────────────────
document.getElementById('pwInput').addEventListener('input', e=>{
  const p = e.target.value;
  document.getElementById('pwLen').textContent = p.length;
  evaluate(p);
});

function evaluate(p){
  let allPassing = true;
  let lastPassIndex = 0;

  for(let i=0; i<highestRule && i<RULES.length; i++){
    const r = RULES[i];
    const passes = r.check(p);
    const div = document.getElementById('rule-'+r.id);
    if(!div) continue;

    div.className = 'rule ' + (passes ? 'pass' : 'fail');
    const hintEl = document.getElementById('hint-'+r.id);
    if(hintEl){
      if(!passes && typeof r.hint === 'function'){
        hintEl.textContent = r.hint(p);
      } else if(passes){
        hintEl.textContent = '✓ Satisfied';
      }
    }

    if(!passes) allPassing = false;
    if(passes) lastPassIndex = i+1;
  }

  // Unlock next rule if all current rules pass
  if(allPassing && highestRule < RULES.length){
    highestRule++;
    addRule(highestRule-1);
    // Re-evaluate with new rule
    evaluate(p);
    return;
  }

  // Update progress
  const passed = [...Array(Math.min(highestRule, RULES.length))].filter((_,i)=>RULES[i].check(p)).length;
  const pct = Math.round((passed/RULES.length)*100);
  document.getElementById('progressBar').style.width = pct+'%';

  // Win condition
  if(highestRule >= RULES.length && allPassing){
    setTimeout(()=>win(p), 400);
  }
}

function addRule(index){
  const r = RULES[index];
  if(!r) return;
  const container = document.getElementById('rulesContainer');
  const div = document.createElement('div');
  div.className = 'rule';
  div.id = 'rule-'+r.id;
  div.innerHTML = `
    <div class="rule-icon">${r.icon}</div>
    <div class="rule-body">
      <div class="rule-num">RULE ${r.id}</div>
      <div class="rule-text">${r.text}</div>
      <div class="rule-hint" id="hint-${r.id}"></div>
    </div>`;
  container.appendChild(div);
  // Scroll to new rule
  div.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function win(p){
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('winPw').textContent = p;
  document.getElementById('winScreen').classList.add('show');
}

// ─────────────────────────────────────────────
//  Controls
// ─────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', init);
document.getElementById('playAgainBtn').addEventListener('click', init);

// ─────────────────────────────────────────────
//  Start
// ─────────────────────────────────────────────
init();
</script>
