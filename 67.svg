<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="38%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#2a1050"/>
      <stop offset="100%" stop-color="#080412"/>
    </radialGradient>

    <!-- Orange button gradient -->
    <radialGradient id="btnGrad" cx="33%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#ffe580"/>
      <stop offset="55%"  stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#b85e00"/>
    </radialGradient>

    <!-- Button inner shine -->
    <radialGradient id="btnShine" cx="35%" cy="25%" r="45%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Orange glow behind button -->
    <filter id="orangeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft drop shadow on text -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Purple ambient left glow -->
    <filter id="purpleGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="940" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle purple ambient behind button -->
  <circle cx="330" cy="200" r="140" fill="#7c3aed" opacity="0.18" filter="url(#purpleGlow)"/>

  <!-- ── Stars ── -->
  <circle cx="22"  cy="18"  r="1.2" fill="white" opacity="0.7"/>
  <circle cx="88"  cy="55"  r="0.9" fill="white" opacity="0.5"/>
  <circle cx="140" cy="22"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="195" cy="78"  r="0.8" fill="white" opacity="0.4"/>
  <circle cx="58"  cy="110" r="1.1" fill="white" opacity="0.55"/>
  <circle cx="30"  cy="200" r="0.9" fill="white" opacity="0.4"/>
  <circle cx="100" cy="310" r="1.3" fill="white" opacity="0.5"/>
  <circle cx="50"  cy="370" r="0.8" fill="white" opacity="0.45"/>
  <circle cx="175" cy="350" r="1.0" fill="white" opacity="0.5"/>
  <circle cx="210" cy="180" r="0.9" fill="white" opacity="0.35"/>
  <circle cx="560" cy="20"  r="1.2" fill="white" opacity="0.6"/>
  <circle cx="640" cy="50"  r="0.9" fill="white" opacity="0.5"/>
  <circle cx="700" cy="25"  r="1.4" fill="white" opacity="0.65"/>
  <circle cx="780" cy="60"  r="0.8" fill="white" opacity="0.4"/>
  <circle cx="850" cy="30"  r="1.1" fill="white" opacity="0.55"/>
  <circle cx="910" cy="90"  r="0.9" fill="white" opacity="0.45"/>
  <circle cx="600" cy="340" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="680" cy="370" r="0.9" fill="white" opacity="0.4"/>
  <circle cx="760" cy="320" r="1.3" fill="white" opacity="0.55"/>
  <circle cx="830" cy="355" r="0.8" fill="white" opacity="0.45"/>
  <circle cx="895" cy="300" r="1.0" fill="white" opacity="0.5"/>
  <circle cx="920" cy="180" r="1.1" fill="white" opacity="0.4"/>
  <circle cx="870" cy="220" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="530" cy="290" r="1.0" fill="white" opacity="0.35"/>
  <circle cx="490" cy="340" r="0.8" fill="white" opacity="0.4"/>

  <!-- ── Orange glow halo behind button ── -->
  <circle cx="330" cy="200" r="115" fill="#ff8800" opacity="0.22" filter="url(#orangeGlow)"/>

  <!-- ── The big 67 button ── -->
  <circle cx="330" cy="200" r="112" fill="#0a0518" opacity="0.3"/>
  <circle cx="330" cy="200" r="108" fill="url(#btnGrad)"/>
  <circle cx="330" cy="200" r="108" fill="url(#btnShine)"/>
  <!-- Border ring -->
  <circle cx="330" cy="200" r="108" fill="none" stroke="rgba(255,220,100,0.25)" stroke-width="3"/>

  <!-- 67 text -->
  <text
    x="330" y="228"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial Rounded MT Bold', Arial, sans-serif"
    font-size="110"
    font-weight="900"
    fill="#1a0800"
    filter="url(#textGlow)"
  >67</text>

  <!-- ── Floating +N scores (various sizes / opacities) ── -->
  <text x="468" y="120" font-family="'Arial Black', Arial, sans-serif" font-size="30" font-weight="900" fill="#ffe27a" opacity="0.95" filter="url(#textGlow)">+1</text>
  <text x="510" y="72"  font-family="'Arial Black', Arial, sans-serif" font-size="22" font-weight="900" fill="#ffe27a" opacity="0.7">+1</text>
  <text x="445" y="165" font-family="'Arial Black', Arial, sans-serif" font-size="18" font-weight="900" fill="#ffcb60" opacity="0.55">+1</text>
  <text x="492" y="230" font-family="'Arial Black', Arial, sans-serif" font-size="26" font-weight="900" fill="#ffe27a" opacity="0.8" filter="url(#textGlow)">+5</text>
  <text x="540" y="175" font-family="'Arial Black', Arial, sans-serif" font-size="16" font-weight="900" fill="#ffcb60" opacity="0.5">+1</text>
  <text x="460" y="290" font-family="'Arial Black', Arial, sans-serif" font-size="20" font-weight="900" fill="#ffe27a" opacity="0.6">+3</text>
  <text x="520" y="310" font-family="'Arial Black', Arial, sans-serif" font-size="14" font-weight="900" fill="#ffcb60" opacity="0.4">+1</text>

  <!-- ── Right-side stats panel ── -->
  <!-- Score display -->
  <text x="710" y="148" text-anchor="middle" font-family="'Arial Rounded MT Bold', Arial, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.35)" letter-spacing="3">POINTS</text>
  <text x="710" y="200" text-anchor="middle" font-family="'Arial Black', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="62" font-weight="900" fill="white" opacity="0.92">67K</text>

  <!-- Divider line -->
  <line x1="600" y1="228" x2="820" y2="228" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Per-click and per-sec stats -->
  <text x="640" y="258" font-family="'Arial Rounded MT Bold', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">per click</text>
  <text x="640" y="282" font-family="'Arial Black', Arial, sans-serif" font-size="22" font-weight="900" fill="rgba(255,200,80,0.9)">+8</text>

  <text x="760" y="258" font-family="'Arial Rounded MT Bold', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">per sec</text>
  <text x="760" y="282" font-family="'Arial Black', Arial, sans-serif" font-size="22" font-weight="900" fill="rgba(255,200,80,0.9)">+47</text>

  <!-- ── Upgrade dots (subtle row of orbs) ── -->
  <text x="600" y="330" font-family="'Arial Rounded MT Bold', Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.28)" letter-spacing="2">UPGRADES</text>
  <!-- Filled dots = owned, empty = not yet -->
  <circle cx="600" cy="355" r="7" fill="#7c3aed" opacity="0.9"/>
  <circle cx="620" cy="355" r="7" fill="#7c3aed" opacity="0.9"/>
  <circle cx="640" cy="355" r="7" fill="#7c3aed" opacity="0.9"/>
  <circle cx="660" cy="355" r="7" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="680" cy="355" r="7" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="700" cy="355" r="7" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="720" cy="355" r="7" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- ── "67 CLICKER" label bottom-left ── -->
  <text x="32" y="378" font-family="'Arial Black', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="15" font-weight="900" fill="rgba(255,255,255,0.22)" letter-spacing="3">67 CLICKER</text>
</svg>
