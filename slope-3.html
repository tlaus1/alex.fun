<!DOCTYPE html>
<!-- Ultimate Game Stash file -->
<html lang="en-us">
<head>
  <!-- alex.fun helpers — BEFORE <base> so they resolve to our origin -->
  <script src="./cover-profiles.js"></script>
  <script src="./supabase-config.js"></script>
  <script defer src="./music-bridge.js"></script>
  <script defer src="./social-bar.js?v=8"></script>
  <link rel="icon" type="image/png" href="./clever1.png">

  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/slope%203/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slope 3</title>

  <style>
    :root { --status-h: 26px; --panel: rgba(0,30,60,.82); --fg: #e6f3ff; --border: rgba(0,200,255,.35); }

    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; background-color: #000;
    }
    .webgl-content {
      width: 100% !important; height: 100% !important;
      display: flex; justify-content: center; align-items: center;
      flex-direction: column;
    }
    #gameContainer {
      width: 100% !important; height: 100% !important;
      flex-grow: 1;
    }
    .footer { display: none; }

    /* alex.fun chrome */
    .alex-topbar {
      position: fixed; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      pointer-events: none; z-index: 9000;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .alex-actions { display: flex; gap: 8px; pointer-events: auto; }
    .alex-btn {
      appearance: none; border: 1.5px solid var(--border); border-radius: 999px;
      background: var(--panel); color: var(--fg); padding: 8px 14px;
      font-family: inherit; font-size: 12px; font-weight: 900;
      cursor: pointer; backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px rgba(0,0,0,.45);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .alex-btn:hover { background: rgba(0,60,90,.95); border-color: #2dd4ff; color: #b3ecff; }

    #alexStatusBar {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--status-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      background: #000810; border-top: 1px solid rgba(0,200,255,.3);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 11px; font-weight: 800; color: rgba(120,220,255,.8);
      z-index: 9100;
    }
    #alexStatusBar .sb-cover { cursor: pointer; user-select: none; }
    #alexStatusBar .sb-cover:hover { color: #d6f4ff; }

    #coverOverlay {
      position: fixed; inset: 0; z-index: 11000;
      background: #fff; opacity: 0; pointer-events: none;
      transition: opacity .45s cubic-bezier(.4,0,.2,1); cursor: pointer;
    }
    #coverOverlay.show { opacity: 1; pointer-events: auto; }
    #coverOverlay img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  </style>

  <!-- File merger config: this build has Slope3.data.unityweb split into 2 parts -->
  <script>
    window.fileMergerConfig = {
      files: [
        { name: 'Slope3.data.unityweb', parts: 2 }
      ],
      basePath: '',
      debug: true
    };
  </script>

  <script>
    (function () {
      'use strict';
      const config = Object.assign({ files: [], basePath: '', debug: true }, window.fileMergerConfig || {});
      window.mergedFiles = window.mergedFiles || {};
      const mergeStatus = {};

      function log(...args)   { if (config.debug) console.log('[FileMerger]', ...args); }
      function error(...args) { console.error('[FileMerger]', ...args); }
      function normalizeUrl(url) { try { return decodeURIComponent(url.toString().split('?')[0]); } catch (e) { return url; } }
      function urlsMatch(url1, url2) {
        const n1 = normalizeUrl(url1), n2 = normalizeUrl(url2);
        const name1 = n1.split('/').pop().split('?')[0];
        const name2 = n2.split('/').pop().split('?')[0];
        for (const f of config.files) {
          if (name1.startsWith(f.name) && name1.length >= f.name.length) return f.name;
          if (name2.startsWith(f.name) && name2.length >= f.name.length) return f.name;
        }
        return null;
      }
      async function mergeSplitFiles(filePath, partsCount) {
        try {
          const parts = [];
          for (let i = 1; i <= partsCount; i++) parts.push(`${filePath}.part${i}`);
          log(`Merging ${filePath} from ${partsCount} parts...`);
          const responses = await Promise.all(parts.map(p => window.originalFetch(p)));
          for (const r of responses) if (!r.ok) throw new Error(`Part missing: ${r.url} (${r.status})`);
          const buffers = await Promise.all(responses.map(r => r.arrayBuffer()));
          const totalLen = buffers.reduce((acc, b) => acc + b.byteLength, 0);
          const merged = new Uint8Array(totalLen);
          let offset = 0;
          for (const b of buffers) { merged.set(new Uint8Array(b), offset); offset += b.byteLength; }
          log(`✅ Merged: ${filePath} (${(totalLen/1024/1024).toFixed(2)} MB)`);
          return merged.buffer;
        } catch (e) { error(e); throw e; }
      }
      function shouldIntercept(url) {
        const s = normalizeUrl(url);
        if (s.includes('.part')) return null;
        const matchedName = urlsMatch(s, s);
        if (matchedName) return matchedName;
        return null;
      }
      function getMerged(name) {
        if (window.mergedFiles[name]) return window.mergedFiles[name];
        for (const [k, v] of Object.entries(window.mergedFiles)) {
          if (k.startsWith(name)) return v;
        }
        return null;
      }

      if (!window.originalFetch) window.originalFetch = window.fetch;
      window.fetch = function (url, ...args) {
        const name = shouldIntercept(url);
        if (name) {
          log('Intercepting fetch:', name);
          return new Promise((resolve, reject) => {
            const t = setInterval(() => {
              const b = getMerged(name);
              if (b) {
                clearInterval(t);
                const type = name.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
                resolve(new Response(b, { status: 200, headers: { 'Content-Type': type } }));
              } else if (mergeStatus[name] === 'failed') {
                clearInterval(t); reject(new Error('Merge failed'));
              }
            }, 50);
          });
        }
        return window.originalFetch.call(this, url, ...args);
      };

      if (!window.OriginalXMLHttpRequest) window.OriginalXMLHttpRequest = window.XMLHttpRequest;
      window.XMLHttpRequest = function (opts) {
        const xhr = new window.OriginalXMLHttpRequest(opts);
        const open = xhr.open;
        xhr.open = function (m, u, ...a) { this._url = u; return open.call(this, m, u, ...a); };
        xhr.send = function (...a) {
          const name = shouldIntercept(this._url);
          if (name) {
            log('Intercepting XHR:', name);
            const t = setInterval(() => {
              const b = getMerged(name);
              if (b) {
                clearInterval(t);
                Object.defineProperties(xhr, { status: { value: 200 }, response: { value: b }, readyState: { value: 4 } });
                if (xhr.onload) xhr.onload({ type: 'load', target: xhr });
              }
            }, 50);
            return;
          }
          return window.OriginalXMLHttpRequest.prototype.send.apply(this, a);
        };
        return xhr;
      };

      async function start() {
        config.files.forEach(f => {
          const path = config.basePath + f.name;
          mergeStatus[f.name] = 'merging';
          mergeSplitFiles(path, f.parts).then(b => {
            window.mergedFiles[f.name] = b;
            window.mergedFiles[path]   = b;
            mergeStatus[f.name] = 'ready';
          }).catch(() => mergeStatus[f.name] = 'failed');
        });
      }
      start();
    })();
  </script>

  <script src="UnityLoader.js"></script>
  <script src="UnityProgress.js"></script>

  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "build.json", {
      onProgress: UnityProgress,
      Module: {
        onRuntimeInitialized: function () {
          UnityProgress(gameInstance, "complete");
        }
      }
    });
  </script>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer" style="width:100%;height:95%;margin:auto;"></div>
    <div class="footer"></div>
  </div>

  <!-- alex.fun top bar -->
  <div class="alex-topbar">
    <div class="alex-actions">
      <button class="alex-btn" id="alexBackBtn" type="button">Back</button>
    </div>
    <div class="alex-actions">
      <button class="alex-btn" id="alexFullscreenBtn" type="button">Fullscreen</button>
    </div>
  </div>

  <!-- alex.fun cover overlay -->
  <div id="coverOverlay" aria-hidden="true">
    <img data-cover-image alt="Cover">
  </div>

  <!-- alex.fun status bar -->
  <div id="alexStatusBar">
    <span>Slope 3</span>
    <span class="sb-cover" id="alexCoverHint">Backspace Cover Image</span>
  </div>

  <!-- Unity game host functions (no-ops; Unity calls these from C#) -->
  <script>
    function UnityCallJs(){}
    function UnityCallPlayJs(){}
    function UnityCallLeaderboardJs(){}
    function UnityCallAgainJs(){}
    function UnityCallEndgameJs(){}
    function UnityCallBackHomeJs(){}
    function UnityCallChangeDayLeaderboardJs(){}
    function UnityCallCloseLeaderboardJs(){}
  </script>

  <!-- alex.fun chrome JS -->
  <script>
    document.getElementById('alexBackBtn').addEventListener('click', function () {
      window.location.href = new URL('index.html', window.location.href).href;
    });

    var alexFsBtn = document.getElementById('alexFullscreenBtn');
    alexFsBtn.addEventListener('click', async function () {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          alexFsBtn.textContent = 'Exit Fullscreen';
        } else {
          await document.exitFullscreen();
          alexFsBtn.textContent = 'Fullscreen';
        }
      } catch (e) { console.log('Fullscreen failed:', e); }
    });
    document.addEventListener('fullscreenchange', function () {
      alexFsBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    });

    var coverOverlay = document.getElementById('coverOverlay');
    function toggleCover() {
      var showing = coverOverlay.classList.toggle('show');
      coverOverlay.setAttribute('aria-hidden', String(!showing));
    }
    coverOverlay.addEventListener('click', toggleCover);
    document.getElementById('alexCoverHint').addEventListener('click', toggleCover);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Backspace' || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      toggleCover();
    }, true);
  </script>
</body>
</html>
