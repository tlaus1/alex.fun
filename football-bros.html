  <!-- Stub the regional ping endpoints BEFORE FootballBros.js loads.
       The game hard-codes pings to `<region>.<hostname>/ping` (8 regions) to
       find the lowest-latency multiplayer server. alexfun.is-a.dev doesn't
       have those subdomains, so every ping fails with ERR_NAME_NOT_RESOLVED,
       and the game then throws "Cannot read properties of undefined (reading
       'length')" when it tries to parse the empty response.
       We intercept both fetch and XHR and return a fake 999ms latency so the
       game treats it as "all servers slow" and falls back to single-player. -->
  <script>
    (function () {
      function isRegionPing(url) {
        if (typeof url !== "string") return false;
        try {
          const u = new URL(url, location.href);
          return u.pathname === "/ping" && /^[a-z]{2,4}\.alexfun\.is-a\.dev$/i.test(u.hostname);
        } catch (_) { return false; }
      }
      // Fetch interception
      const origFetch = window.fetch;
      window.fetch = function (input, init) {
        const url = typeof input === "string" ? input : (input && input.url);
        if (isRegionPing(url)) {
          return Promise.resolve(new Response("999", {
            status: 200,
            headers: { "Content-Type": "text/plain" }
          }));
        }
        return origFetch.apply(this, arguments);
      };
      // XHR interception
      const OriginalXHR = window.XMLHttpRequest;
      window.XMLHttpRequest = function () {
        const xhr = new OriginalXHR();
        const origOpen = xhr.open;
        const origSend = xhr.send;
        let isStub = false;
        xhr.open = function (method, url) {
          if (isRegionPing(url)) { isStub = true; return; }
          return origOpen.apply(xhr, arguments);
        };
        xhr.send = function () {
          if (!isStub) return origSend.apply(xhr, arguments);
          setTimeout(function () {
            try {
              Object.defineProperty(xhr, "readyState",   { value: 4,    configurable: true });
              Object.defineProperty(xhr, "status",       { value: 200,  configurable: true });
              Object.defineProperty(xhr, "responseText", { value: "999",configurable: true });
              Object.defineProperty(xhr, "response",     { value: "999",configurable: true });
            } catch (_) {}
            try { xhr.dispatchEvent(new Event("readystatechange")); } catch (_) {}
            try { xhr.dispatchEvent(new Event("load")); } catch (_) {}
            try { xhr.dispatchEvent(new Event("loadend")); } catch (_) {}
            if (typeof xhr.onreadystatechange === "function") {
              try { xhr.onreadystatechange(); } catch (_) {}
            }
            if (typeof xhr.onload === "function") {
              try { xhr.onload(); } catch (_) {}
            }
          }, 40);
        };
        return xhr;
      };
      // Final safety net — swallow uncaught errors from FootballBros.js's
      // ping-result parser so they don't crash the boot.
      window.addEventListener("error", function (e) {
        const msg = (e.error && e.error.message) || e.message || "";
        if (/reading 'length'/.test(msg) && /FootballBros\.js/.test(e.filename || "")) {
          e.preventDefault();
        }
      });
    })();
  </script>

  <!-- alex.fun chrome JS -->
  <script>
    document.getElementById('alexBackBtn').addEventListener('click', function () {
      window.location.href = new URL('index.html', window.location.href).href;
    });

    var alexFsBtn = document.getElementById('alexFullscreenBtn');
    alexFsBtn.addEventListener('click', async function () {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          alexFsBtn.textContent = 'Exit Fullscreen';
        } else {
          await document.exitFullscreen();
          alexFsBtn.textContent = 'Fullscreen';
        }
      } catch (e) { console.log('Fullscreen failed:', e); }
    });
    document.addEventListener('fullscreenchange', function () {
      alexFsBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    });

    // Cover overlay (Backspace) — toggle on/off so music-bridge can detect
    var coverOverlay = document.getElementById('coverOverlay');
    function toggleCover() {
      var showing = coverOverlay.classList.toggle('show');
      coverOverlay.setAttribute('aria-hidden', String(!showing));
    }
    coverOverlay.addEventListener('click', toggleCover);
    document.getElementById('alexCoverHint').addEventListener('click', toggleCover);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Backspace' || e.metaKey || e.ctrlKey || e.altKey) return;
      // Don't steal Backspace when user is typing
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      toggleCover();
    }, true);
  </script>
