  <!-- Stub the regional ping endpoints BEFORE FootballBros.js loads.
       The game hard-codes pings to `<region>.<hostname>/ping` (8 regions) to
       find the lowest-latency multiplayer server. alexfun.is-a.dev doesn't
       have those subdomains, so every ping fails with ERR_NAME_NOT_RESOLVED,
       and the game then throws "Cannot read properties of undefined (reading
       'length')" when it tries to parse the empty response.
       We intercept fetch/XHR/Image/sendBeacon and fire `error` events so the
       game treats every region as unreachable and falls back to single-player. -->
  <script>
    (function () {
      function isRegionPing(url) {
        if (typeof url !== "string") return false;
        try {
          const u = new URL(url, location.href);
          return u.pathname === "/ping" && /^[a-z]{2,4}\.alexfun\.is-a\.dev$/i.test(u.hostname);
        } catch (_) { return false; }
      }
      function fakeImageError(img) {
        setTimeout(function () {
          try { img.dispatchEvent(new Event("error")); } catch (_) {}
          if (typeof img.onerror === "function") { try { img.onerror(); } catch (_) {} }
        }, 40);
      }
      // Fetch interception — reject so the game's ping code treats it as
      // an unreachable server (rather than parsing a bogus body).
      const origFetch = window.fetch;
      window.fetch = function (input, init) {
        const url = typeof input === "string" ? input : (input && input.url);
        if (isRegionPing(url)) {
          return Promise.reject(new TypeError("Failed to fetch"));
        }
        return origFetch.apply(this, arguments);
      };
      // XHR interception — fire `error` (not `load`) so the game's parser
      // never tries to read a synthetic response body.
      const OriginalXHR = window.XMLHttpRequest;
      window.XMLHttpRequest = function () {
        const xhr = new OriginalXHR();
        const origOpen = xhr.open;
        const origSend = xhr.send;
        let isStub = false;
        xhr.open = function (method, url) {
          if (isRegionPing(url)) { isStub = true; return; }
          return origOpen.apply(xhr, arguments);
        };
        xhr.send = function () {
          if (!isStub) return origSend.apply(xhr, arguments);
          setTimeout(function () {
            try { xhr.dispatchEvent(new Event("error")); } catch (_) {}
            try { xhr.dispatchEvent(new Event("loadend")); } catch (_) {}
            if (typeof xhr.onerror === "function") { try { xhr.onerror(); } catch (_) {} }
          }, 40);
        };
        return xhr;
      };
      // Image src interception (the game uses `new Image().src = ...` for pings —
      // bypasses fetch and XHR entirely). Fire `error` to mimic an unreachable host.
      try {
        const imgProto = HTMLImageElement.prototype;
        const origSrcDesc = Object.getOwnPropertyDescriptor(imgProto, "src");
        if (origSrcDesc && origSrcDesc.set) {
          Object.defineProperty(imgProto, "src", {
            configurable: true,
            enumerable: true,
            get() { return origSrcDesc.get.call(this); },
            set(v) {
              if (isRegionPing(v)) { fakeImageError(this); return; }
              origSrcDesc.set.call(this, v);
            },
          });
        }
        // Also catch img.setAttribute('src', url)
        const origSetAttr = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function (name, value) {
          if (this instanceof HTMLImageElement && /^src$/i.test(name) && isRegionPing(value)) {
            fakeImageError(this);
            return;
          }
          return origSetAttr.apply(this, arguments);
        };
      } catch (_) {}
      // sendBeacon interception
      try {
        const origBeacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
        if (origBeacon) {
          navigator.sendBeacon = function (url, data) {
            if (isRegionPing(url)) return true;
            return origBeacon(url, data);
          };
        }
      } catch (_) {}
      // Final safety net — swallow ALL uncaught errors from FootballBros.js.
      // The game's multiplayer ping/parser code is the only thing failing here,
      // and we're killing that whole subsystem deliberately. Single-player and
      // the core game loop run fine without it.
      window.addEventListener("error", function (e) {
        if (/FootballBros\.js/.test(e.filename || "")) {
          e.preventDefault();
        }
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        const msg = (e.reason && (e.reason.message || e.reason)) || "";
        if (/Failed to fetch/.test(String(msg))) e.preventDefault();
      });
    })();
  </script>
