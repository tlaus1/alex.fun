<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clever | Portal</title>
  <link rel="icon" type="image/png" href="./clever1.png" />
  <style>
    :root {
      --bg: #e9e9e9;
      --card-border: #202020;
      --text: #121212;
      --muted: #3e3e3e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1160px;
      margin: 0 auto;
      padding: 16px 16px 40px;
    }

    .top-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .pill {
      border: 2px solid #8d8d8d;
      background: #efefef;
      border-radius: 18px;
      padding: 12px 22px;
      font-size: 20px;
    }

    .hero {
      text-align: center;
      margin: 8px 0 18px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(46px, 7vw, 96px);
      letter-spacing: 1px;
      text-transform: lowercase;
    }

    .hero p {
      margin: 4px 0 0;
      font-size: clamp(24px, 3vw, 44px);
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      border: 4px solid var(--card-border);
      border-radius: 26px;
      overflow: hidden;
      aspect-ratio: 2.3 / 1;
      background: linear-gradient(130deg, #6dd5fa, #2980b9);
      cursor: pointer;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.35), transparent 28%),
        radial-gradient(circle at 82% 80%, rgba(255,255,255,0.25), transparent 26%);
      pointer-events: none;
    }

    .card-title {
      position: absolute;
      left: 20px;
      bottom: 16px;
      margin: 0;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
      font-size: clamp(24px, 3.5vw, 56px);
      line-height: 1;
      font-weight: 700;
      z-index: 2;
    }

    .card-67 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      inset: 0;
    }

    .cursor-click {
      position: absolute;
      right: 30px;
      top: 28px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      display: grid;
      place-items: center;
      font-size: 30px;
      z-index: 3;
    }

    .cursor-click::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 3px solid rgba(255,255,255,0.85);
      border-radius: 50%;
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .theme-2 { background: linear-gradient(125deg, #141e30, #243b55); }
    .theme-3 { background: linear-gradient(125deg, #ff006e, #8338ec); }
    .theme-4 { background: linear-gradient(125deg, #06d6a0, #118ab2); }
    .theme-5 { background: linear-gradient(125deg, #fb8500, #d62828); }
    .theme-6 { background: linear-gradient(125deg, #3a0ca3, #4cc9f0); }
    .theme-7 { background: linear-gradient(125deg, #588157, #344e41); }
    .theme-8 { background: linear-gradient(125deg, #c1121f, #003049); }

    #idlePhoto {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: block;
      background: #000;
    }

    #idlePhoto.hidden { display: none; }

    #idlePhoto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center; /* show top, crop bottom */
      display: block;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .pill { font-size: 18px; padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-row">
      <button class="pill" type="button">Get new posts</button>
    </div>

    <header class="hero">
      <h1>alex.fun</h1>
      <p>games and stuff</p>
    </header>

    <main class="grid">
      <article class="card card-67">
        <img src="./67.png" alt="67 clicker preview">
        <div class="cursor-click">🖱️</div>
        <h3 class="card-title">67 clicker</h3>
      </article>

      <article class="card theme-2"><h3 class="card-title">Sandboxe1s</h3></article>
      <article class="card theme-3"><h3 class="card-title">Constellation Draw</h3></article>
      <article class="card theme-4"><h3 class="card-title">Size of Life</h3></article>
      <article class="card theme-5"><h3 class="card-title">Internet Roadtrip</h3></article>
      <article class="card theme-6"><h3 class="card-title">Infinite Craft</h3></article>
      <article class="card theme-7"><h3 class="card-title">Internet Artifacts</h3></article>
      <article class="card theme-8"><h3 class="card-title">The Puzzle Game</h3></article>
    </main>
  </div>

  <div id="idlePhoto" aria-hidden="true">
    <img src="./cleverpage.png" alt="Idle screen" />
  </div>

  <script>
    const IDLE_MS = 5000;
    const idlePhoto = document.getElementById("idlePhoto");
    let idleTimer = null;

    function showIdle() {
      idlePhoto.classList.remove("hidden");
      clearTimeout(idleTimer);
    }

    function hideIdleAndArmTimer() {
      idlePhoto.classList.add("hidden");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(showIdle, IDLE_MS);
    }

    showIdle();

    const events = ["mousemove", "mousedown", "scroll", "touchstart", "click", "input", "wheel"];
    events.forEach((evt) => {
      window.addEventListener(evt, hideIdleAndArmTimer, { passive: true });
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Backspace") {
        showIdle(); // instant snap to photo on backspace
        return;
      }
      hideIdleAndArmTimer();
    });
  </script>
</body>
</html>
