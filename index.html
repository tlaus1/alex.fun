<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clever | Portal</title>
  <link rel="icon" type="image/png" href="./clever1.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;
      background: #fff;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    /* ══════════════════════════════════════════════
       DASHBOARD
    ══════════════════════════════════════════════ */
    #dashboard {
      max-width: 1060px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    /* ── Header ── */
    .site-header {
      position: relative;
      text-align: center;
      margin-bottom: 44px;
    }

    /* "Get new posts" floated to top-right, like neal.fun */
    .pill {
      position: absolute;
      top: 0;
      right: 0;
      font-family: "Nunito", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #1a1a1a;
      background: #fff;
      border: 1.5px solid #d4d4d4;
      border-radius: 100px;
      padding: 8px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .pill:hover {
      background: #f5f5f5;
      border-color: #bbb;
      transform: translateY(-1px);
    }

    .pill:active { transform: translateY(0); }

    /* Big chunky site name */
    .brand-name {
      font-family: "Paytone One", "Arial Rounded MT Bold", Arial, sans-serif;
      font-size: clamp(52px, 9vw, 96px);
      font-weight: 400; /* Paytone One is already bold */
      color: #1a1a1a;
      line-height: 1;
      letter-spacing: -1px;
      margin-bottom: 8px;
      display: block;
    }

    .brand-tag {
      font-size: 17px;
      color: #888;
      font-weight: 700;
      display: block;
    }

    /* ── 2-column card grid — matching neal.fun ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    /* ── Cards ── */
    .card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 2.35 / 1;
      cursor: pointer;
      background: linear-gradient(130deg, #6dd5fa, #2980b9);
      border: 1.5px solid #e0e0e0;
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.13);
    }

    .card:active {
      transform: scale(0.99);
      transition-duration: 0.08s;
    }

    /* Gradient scrim for title readability */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.52) 0%,
        rgba(0, 0, 0, 0.06) 40%,
        transparent 65%
      );
      pointer-events: none;
    }

    .card-title {
      position: absolute;
      left: 18px;
      bottom: 15px;
      color: #fff;
      font-size: clamp(18px, 2.6vw, 34px);
      font-weight: 900;
      line-height: 1.1;
      z-index: 2;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
    }

    /* ── 67 Clicker card ── */
    .card-67 {
      background: linear-gradient(130deg, #1a1020, #2e1e50);
    }

    .card-67 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      display: block;
    }

    .cursor-click {
      position: absolute;
      right: 16px;
      top: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: grid;
      place-items: center;
      font-size: 20px;
      z-index: 3;
    }

    .cursor-click::after {
      content: "";
      position: absolute;
      inset: -7px;
      border: 2.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: pulse 1.1s ease-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* ── Card themes ── */
    .theme-2 { background: linear-gradient(125deg, #141e30, #243b55); }
    .theme-3 { background: linear-gradient(125deg, #ff006e, #8338ec); }
    .theme-4 { background: linear-gradient(125deg, #06d6a0, #118ab2); }
    .theme-5 { background: linear-gradient(125deg, #fb8500, #d62828); }
    .theme-6 { background: linear-gradient(125deg, #3a0ca3, #4cc9f0); }
    .theme-7 { background: linear-gradient(125deg, #588157, #344e41); }
    .theme-8 { background: linear-gradient(125deg, #c1121f, #003049); }

    /* ── Staggered card entrance ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:nth-child(1) { animation: fadeUp 0.35s ease 0.04s both; }
    .card:nth-child(2) { animation: fadeUp 0.35s ease 0.09s both; }
    .card:nth-child(3) { animation: fadeUp 0.35s ease 0.14s both; }
    .card:nth-child(4) { animation: fadeUp 0.35s ease 0.19s both; }
    .card:nth-child(5) { animation: fadeUp 0.35s ease 0.24s both; }
    .card:nth-child(6) { animation: fadeUp 0.35s ease 0.29s both; }
    .card:nth-child(7) { animation: fadeUp 0.35s ease 0.34s both; }
    .card:nth-child(8) { animation: fadeUp 0.35s ease 0.39s both; }

    /* ══════════════════════════════════════════════
       GAME SCREEN
    ══════════════════════════════════════════════ */
    #game67 {
      max-width: 1060px;
      margin: 0 auto;
      padding: 24px 24px 60px;
    }

    .game-top {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: "Nunito", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #1a1a1a;
      background: #fff;
      border: 1.5px solid #d4d4d4;
      border-radius: 100px;
      padding: 8px 18px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
    }

    .btn:hover {
      background: #f5f5f5;
      border-color: #bbb;
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .game-wrap {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
    }

    .play-area {
      border: 1.5px solid #e0e0e0;
      border-radius: 18px;
      background: #fafafa;
      min-height: 68vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .stats { margin-bottom: 26px; }

    .points-display {
      font-size: clamp(26px, 4vw, 48px);
      font-weight: 900;
      color: #1a1a1a;
      margin-bottom: 6px;
      line-height: 1;
    }

    .points-display span { color: #e67e00; }

    .rate-row {
      font-size: 14px;
      color: #aaa;
      font-weight: 700;
    }

    .rate-row strong { color: #555; }

    #big67 {
      width: min(260px, 62vw);
      height: min(260px, 62vw);
      border-radius: 50%;
      border: 3px solid rgba(0, 0, 0, 0.07);
      background: radial-gradient(circle at 32% 28%, #ffe27a, #ff9f1c 58%, #c96a00);
      color: #1a0800;
      font-family: "Paytone One", Arial, sans-serif;
      font-size: clamp(62px, 10vw, 118px);
      font-weight: 400;
      cursor: pointer;
      transition: transform 0.07s ease, box-shadow 0.14s ease;
      user-select: none;
      position: relative;
      z-index: 1;
      box-shadow: 0 6px 28px rgba(201, 106, 0, 0.3);
    }

    #big67:hover { box-shadow: 0 10px 44px rgba(201, 106, 0, 0.45); }
    #big67:active { transform: scale(0.92); }

    .float-text {
      position: absolute;
      pointer-events: none;
      font-size: 21px;
      font-weight: 900;
      color: #e67e00;
      z-index: 10;
      animation: floatUp 0.8s ease forwards;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      50%  { opacity: 1; transform: translateY(-48px) scale(1.12); }
      100% { opacity: 0; transform: translateY(-88px) scale(0.8); }
    }

    .shop {
      border: 1.5px solid #e0e0e0;
      border-radius: 18px;
      background: #fafafa;
      padding: 16px;
      max-height: 80vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #ddd transparent;
    }

    .shop::-webkit-scrollbar { width: 4px; }
    .shop::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .shop-label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #ccc;
      margin-bottom: 12px;
    }

    .upgrade {
      border: 1.5px solid #e8e8e8;
      border-radius: 12px;
      background: #fff;
      padding: 11px 13px;
      margin-bottom: 8px;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.14s;
    }

    .upgrade.affordable {
      border-color: #ffc107;
      box-shadow: 0 2px 10px rgba(255, 193, 7, 0.18);
    }

    .upgrade:hover { transform: translateX(2px); }

    .upgrade-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
    }

    .upgrade-icon { font-size: 16px; flex-shrink: 0; }
    .upgrade-name { font-size: 13px; font-weight: 800; color: #1a1a1a; flex: 1; }
    .upgrade-count {
      font-size: 10px;
      font-weight: 700;
      color: #bbb;
      background: #f2f2f2;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .upgrade-desc {
      font-size: 11px;
      color: #bbb;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .buy {
      width: 100%;
      border: 1.5px solid #1a1a1a;
      background: #1a1a1a;
      color: #fff;
      border-radius: 10px;
      padding: 7px;
      font-family: "Nunito", Arial, sans-serif;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.14s, transform 0.1s;
    }

    .buy:hover:not(:disabled) { background: #333; transform: translateY(-1px); }
    .buy:active:not(:disabled) { transform: translateY(0); }

    .buy:disabled {
      background: #f0f0f0;
      border-color: #e8e8e8;
      color: #ccc;
      cursor: not-allowed;
    }

    .upgrade.affordable .buy:not(:disabled) {
      background: #ffc107;
      border-color: #ffc107;
      color: #1a0800;
    }

    .upgrade.affordable .buy:hover:not(:disabled) {
      background: #e6ac00;
      border-color: #e6ac00;
    }

    /* ══════════════════════════════════════════════
       IDLE OVERLAY
    ══════════════════════════════════════════════ */
    #idlePhoto {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #idlePhoto.hidden { opacity: 0; pointer-events: none; }
    #idlePhoto.no-transition { transition: none !important; }

    #idlePhoto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ══════════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════════ */
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .game-wrap { grid-template-columns: 1fr; }
      .shop { max-height: none; }
      .pill { font-size: 12px; padding: 6px 13px; }
    }
  </style>
</head>
<body>

  <!-- ══ Dashboard ══════════════════════════════════════════════ -->
  <div id="dashboard">

    <header class="site-header">
      <button class="pill" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
        Get new posts
      </button>
      <span class="brand-name">alex.fun</span>
      <span class="brand-tag">games and stuff</span>
    </header>

    <main class="grid">

      <article class="card card-67" id="open67">
        <img src="./67.png" alt="67 Clicker preview" onerror="this.style.display='none'">
        <div class="cursor-click">🖱️</div>
        <h3 class="card-title">67 Clicker</h3>
      </article>

      <article class="card theme-2">
        <h3 class="card-title">Sandboxe1s</h3>
      </article>

      <article class="card theme-3">
        <h3 class="card-title">Constellation Draw</h3>
      </article>

      <article class="card theme-4">
        <h3 class="card-title">Size of Life</h3>
      </article>

      <article class="card theme-5">
        <h3 class="card-title">Internet Roadtrip</h3>
      </article>

      <article class="card theme-6">
        <h3 class="card-title">Infinite Craft</h3>
      </article>

      <article class="card theme-7">
        <h3 class="card-title">Internet Artifacts</h3>
      </article>

      <article class="card theme-8">
        <h3 class="card-title">The Puzzle Game</h3>
      </article>

    </main>
  </div>

  <!-- ══ 67 Clicker ═════════════════════════════════════════════ -->
  <section id="game67" class="hidden">

    <div class="game-top">
      <button id="backToDash"    class="btn" type="button">← Back</button>
      <button id="fullscreenBtn" class="btn" type="button">Fullscreen</button>
      <button id="resetGame"     class="btn" type="button">Reset Game</button>
    </div>

    <div class="game-wrap">

      <div class="play-area" id="playArea">
        <div>
          <div class="stats">
            <div class="points-display"><span id="points">0</span> pts</div>
            <div class="rate-row">
              <strong id="perClick">1</strong> per click
              &nbsp;·&nbsp;
              <strong id="perSec">0</strong>/sec
            </div>
          </div>
          <button id="big67" type="button">67</button>
        </div>
      </div>

      <aside class="shop">
        <span class="shop-label">Upgrades</span>
      </aside>

    </div>
  </section>

  <!-- ══ Idle photo ═════════════════════════════════════════════ -->
  <div id="idlePhoto" aria-hidden="true">
    <img src="./cleverpage.png" alt="Idle screen" />
  </div>

  <script>
    // ── Idle logic ────────────────────────────────────────────────
    const IDLE_MS   = 5000;
    const idlePhoto = document.getElementById("idlePhoto");
    let   idleTimer = null;

    function showIdle(instant) {
      if (instant) {
        idlePhoto.classList.add("no-transition");
        idlePhoto.classList.remove("hidden");
        requestAnimationFrame(() => requestAnimationFrame(() => {
          idlePhoto.classList.remove("no-transition");
        }));
      } else {
        idlePhoto.classList.remove("hidden");
      }
      clearTimeout(idleTimer);
    }

    function hideIdleAndArmTimer() {
      idlePhoto.classList.add("hidden");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => showIdle(false), IDLE_MS);
    }

    showIdle(true);

    ["mousemove", "mousedown", "scroll", "touchstart", "click", "input", "wheel"].forEach(evt => {
      window.addEventListener(evt, hideIdleAndArmTimer, { passive: true });
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Backspace") { showIdle(true); return; }
      hideIdleAndArmTimer();
    });

    // ── Screen switching ──────────────────────────────────────────
    const dashboard = document.getElementById("dashboard");
    const game67El  = document.getElementById("game67");

    document.getElementById("open67").addEventListener("click", () => {
      dashboard.classList.add("hidden");
      game67El.classList.remove("hidden");
    });

    document.getElementById("backToDash").addEventListener("click", () => {
      game67El.classList.add("hidden");
      dashboard.classList.remove("hidden");
    });

    // ── Upgrade definitions ───────────────────────────────────────
    const upgradeConfig = [
      { key:"multi",      icon:"🖱️",  name:"Multiple Clickers", desc:"+1 point per click",       cost:25,              scale:1.4,  onBuy:()=>{ clickPower+=1; } },
      { key:"auto",       icon:"🤖",  name:"Autoclicker",        desc:"+1 point/sec",              cost:50,              scale:1.6,  onBuy:()=>{ perSec+=1; } },
      { key:"factory",    icon:"🏭",  name:"67 Factory",         desc:"+8 points/sec",             cost:400,             scale:1.7,  onBuy:()=>{ perSec+=8; } },
      { key:"mine",       icon:"⛏️",  name:"67 Mine",            desc:"+47 points/sec",            cost:4_000,           scale:1.8,  onBuy:()=>{ perSec+=47; } },
      { key:"lab",        icon:"🔬",  name:"67 Laboratory",      desc:"+260 points/sec",           cost:40_000,          scale:1.85, onBuy:()=>{ perSec+=260; } },
      { key:"powerclick", icon:"⚡",  name:"Power Click",        desc:"+10 points per click",      cost:100_000,         scale:1.9,  onBuy:()=>{ clickPower+=10; } },
      { key:"dimension",  icon:"🌀",  name:"67 Dimension",       desc:"+1,600 points/sec",         cost:500_000,         scale:1.9,  onBuy:()=>{ perSec+=1_600; } },
      { key:"empire",     icon:"👑",  name:"67 Empire",          desc:"+10,000 points/sec",        cost:7_000_000,       scale:2.0,  onBuy:()=>{ perSec+=10_000; } },
      { key:"galaxy",     icon:"🌌",  name:"67 Galaxy",          desc:"+65,000 points/sec",        cost:100_000_000,     scale:2.1,  onBuy:()=>{ perSec+=65_000; } },
      { key:"mason",      icon:"🧱",  name:"Mason 67",           desc:"+400,000 points/sec",       cost:1_000_000_000,   scale:2.2,  onBuy:()=>{ perSec+=400_000; } },
      { key:"god",        icon:"✨",  name:"67 God",             desc:"+2,500,000 points/sec",     cost:1_000_000_000_000, scale:2.5, onBuy:()=>{ perSec+=2_500_000; } }
    ];

    let points     = 0;
    let clickPower = 1;
    let perSec     = 0;

    const state = {};
    upgradeConfig.forEach(cfg => { state[cfg.key] = { count:0, cost:cfg.cost }; });

    // ── Build shop DOM ────────────────────────────────────────────
    const shopEl = document.querySelector(".shop");
    upgradeConfig.forEach(cfg => {
      const div = document.createElement("div");
      div.className = "upgrade";
      div.id = "upg_" + cfg.key;
      div.innerHTML = `
        <div class="upgrade-header">
          <span class="upgrade-icon">${cfg.icon}</span>
          <span class="upgrade-name">${cfg.name}</span>
          <span class="upgrade-count" id="count_${cfg.key}">0</span>
        </div>
        <div class="upgrade-desc">${cfg.desc}</div>
        <button class="buy" id="buy_${cfg.key}" type="button">
          Buy — <span id="cost_${cfg.key}">${formatNum(cfg.cost)}</span>
        </button>`;
      shopEl.appendChild(div);
    });

    function formatNum(n) {
      if (n >= 1e12) return (n/1e12).toFixed(2)+"T";
      if (n >= 1e9)  return (n/1e9 ).toFixed(2)+"B";
      if (n >= 1e6)  return (n/1e6 ).toFixed(2)+"M";
      if (n >= 1e3)  return (n/1e3 ).toFixed(1)+"K";
      return Math.floor(n).toString();
    }

    function updateUI() {
      document.getElementById("points").textContent   = formatNum(points);
      document.getElementById("perClick").textContent = formatNum(clickPower);
      document.getElementById("perSec").textContent   = formatNum(perSec);
      upgradeConfig.forEach(cfg => {
        const u = state[cfg.key];
        const canBuy = points >= u.cost;
        document.getElementById("count_"+cfg.key).textContent = u.count;
        document.getElementById("cost_" +cfg.key).textContent = formatNum(u.cost);
        document.getElementById("buy_"  +cfg.key).disabled    = !canBuy;
        document.getElementById("upg_"  +cfg.key).classList.toggle("affordable", canBuy);
      });
    }

    function buyUpgrade(key) {
      const cfg = upgradeConfig.find(c => c.key === key);
      const u   = state[key];
      if (points < u.cost) return;
      points  -= u.cost;
      u.count += 1;
      cfg.onBuy();
      u.cost = Math.ceil(u.cost * cfg.scale);
      updateUI();
    }

    upgradeConfig.forEach(cfg => {
      document.getElementById("buy_"+cfg.key).addEventListener("click", () => buyUpgrade(cfg.key));
    });

    const big67    = document.getElementById("big67");
    const playArea = document.getElementById("playArea");

    big67.addEventListener("click", e => {
      points += clickPower;
      updateUI();
      const rect = playArea.getBoundingClientRect();
      const span = document.createElement("span");
      span.className   = "float-text";
      span.textContent = "+" + formatNum(clickPower);
      span.style.left  = (e.clientX - rect.left + (Math.random()*36-18)) + "px";
      span.style.top   = (e.clientY - rect.top  - 8) + "px";
      playArea.appendChild(span);
      span.addEventListener("animationend", () => span.remove());
    });

    document.getElementById("resetGame").addEventListener("click", () => {
      if (!confirm("Reset all progress?")) return;
      points=0; clickPower=1; perSec=0;
      upgradeConfig.forEach(cfg => { state[cfg.key].count=0; state[cfg.key].cost=cfg.cost; });
      updateUI();
    });

    document.getElementById("fullscreenBtn").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch(e) { console.log("Fullscreen blocked:", e); }
    });

    setInterval(() => {
      if (perSec > 0) { points += perSec/10; updateUI(); }
    }, 100);

    updateUI();
  </script>

</body>
</html>
