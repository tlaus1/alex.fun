<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Chrome logo — three 120° sectors (red top, green right, yellow left)
       wrapping a blue center, separated by white. Used as the favicon for
       the "New Tab" tab disguise. -->
  <path fill="#EA4335" d="M24 24 L3.22 12 A24 24 0 0 1 44.78 12 Z"/>
  <path fill="#34A853" d="M24 24 L44.78 12 A24 24 0 0 1 24 48 Z"/>
  <path fill="#FBBC04" d="M24 24 L24 48 A24 24 0 0 1 3.22 12 Z"/>
  <!-- White separator lines between sectors -->
  <line x1="24" y1="24" x2="3.22"  y2="12" stroke="#fff" stroke-width="2"/>
  <line x1="24" y1="24" x2="44.78" y2="12" stroke="#fff" stroke-width="2"/>
  <line x1="24" y1="24" x2="24"    y2="48" stroke="#fff" stroke-width="2"/>
  <!-- White ring around the blue center -->
  <circle cx="24" cy="24" r="12" fill="#fff"/>
  <circle cx="24" cy="24" r="10" fill="#4285F4"/>
</svg>
