<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drift Boss — alex.fun</title>
  <link rel="icon" type="image/png" href="./clever1.png">

  <script src="./cover-profiles.js"></script>
  <script src="./supabase-config.js"></script>
  <script defer src="./music-bridge.js"></script>
  <script defer src="./social-bar.js?v=12"></script>
  <script defer src="./game-chrome.js"
          data-game-name="Drift Boss"
          data-theme-accent="#f59e0b"
          data-status-bg="#0f172a"
          data-status-fg="#cbd5e1"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin:0; width:100%; height:100%; overflow:hidden;
      background:#111827; color:#f8fafc;
    }
    .game-shell {
      position:fixed; inset:0 0 var(--status-h, 26px) 0;
      background:#000;
    }
    iframe { width:100%; height:100%; border:0; display:block; background:#000; }
  </style>
</head>
<body>
  <main class="game-shell" id="gameShell">
    <iframe
      id="gameFrame"
      src="https://blooket.study/storage/driftboss/"
      title="Drift Boss"
      allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
      referrerpolicy="no-referrer">
    </iframe>
  </main>
</body>
</html>
