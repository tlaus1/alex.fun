      background:#0d0d0d;color:#f0f0f0;min-height:100vh;
      display:flex;flex-direction:column;
      padding-bottom:26px;
      animation:pageIn .32s ease both;
    }
    @keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* ── Top bar ── */
    .top-bar{
      display:flex;align-items:center;gap:10px;
      padding:10px 20px;background:#111;
      border-bottom:1px solid #222;flex-shrink:0;
      position:sticky;top:0;z-index:100;
    }
    .btn{
      font-family:inherit;font-size:13px;font-weight:800;
      color:#f0f0f0;background:transparent;border:1.5px solid #333;
      border-radius:100px;padding:6px 14px;cursor:pointer;
      transition:background .13s,border-color .13s,transform .1s;white-space:nowrap;
    }
    .btn:hover{background:#1e1e1e;border-color:#555;transform:translateY(-1px);}

    /* ── Hero ── */
    .hero{
      background:linear-gradient(160deg,#0a1a0a 0%,#001a00 40%,#0a1200 100%);
      padding:28px 24px 22px;text-align:center;position:relative;overflow:hidden;
    }
    .hero::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(0,255,80,.08) 0%,transparent 70%);
      pointer-events:none;
    }
    .hero-label{font-size:11px;font-weight:900;letter-spacing:3px;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:4px;}
    .hero-name{font-size:14px;font-weight:800;color:rgba(255,255,255,.45);margin-bottom:8px;}
    #moneyDisplay{
      font-size:clamp(32px,7vw,68px);font-weight:900;
      color:#2ecc71;line-height:1;letter-spacing:-1px;
      text-shadow:0 0 40px rgba(46,204,113,.3);
      transition:color .2s;
    }
    #moneyDisplay.low{color:#e74c3c;text-shadow:0 0 40px rgba(231,76,60,.3);}
    .progress-wrap{background:#111;border-radius:100px;height:7px;margin:14px auto 0;max-width:560px;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);border-radius:100px;transition:width .4s ease;width:100%;}
    .progress-fill.low{background:linear-gradient(90deg,#c0392b,#e74c3c);}
    .hero-stats{display:flex;gap:20px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
    .stat{font-size:12px;font-weight:800;color:rgba(255,255,255,.4);}
    .stat span{color:rgba(255,255,255,.75);}

    /* ── Filters ── */
    .filters{
      display:flex;gap:8px;padding:13px 16px;overflow-x:auto;
      background:#111;border-bottom:1px solid #1a1a1a;scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{display:none;}
    .filter-btn{
      font-family:inherit;font-size:12px;font-weight:800;
      padding:5px 13px;border-radius:100px;border:1.5px solid #2a2a2a;
      background:#1a1a1a;color:rgba(255,255,255,.5);cursor:pointer;
      white-space:nowrap;transition:all .15s;flex-shrink:0;
    }
    .filter-btn:hover{border-color:#3a3a3a;color:rgba(255,255,255,.75);}
    .filter-btn.active{background:#2ecc71;border-color:#2ecc71;color:#000;}

    /* ── Grid ── */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
      gap:14px;padding:18px;
    }

    /* ── Item card ── */
    .item-card{
      background:#161616;border:1.5px solid #222;
      border-radius:16px;overflow:hidden;
      display:flex;flex-direction:column;
      transition:border-color .15s,transform .15s,box-shadow .15s;
      position:relative;cursor:default;
    }
    .item-card:hover{border-color:#2ecc71;transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.35);}
    .item-card.has-items{border-color:#27ae60;background:#0f1a0f;}
    .item-card.cant-afford{opacity:.38;pointer-events:none;}

    /* ── Photo area ── */
    .item-photo{
      width:100%;height:140px;position:relative;overflow:hidden;
      background:#1c1c1c;flex-shrink:0;
    }
    .item-photo img{
      width:100%;height:100%;object-fit:cover;display:block;
      transition:transform .3s ease;
    }
    .item-card:hover .item-photo img{transform:scale(1.06);}
    /* Emoji fallback shown when img fails */
    .item-photo .emoji-fb{
      display:none;width:100%;height:100%;
      align-items:center;justify-content:center;
      font-size:52px;
    }

    /* ── Count badge ── */
    .count-badge{
      position:absolute;top:8px;right:8px;z-index:3;
      background:#2ecc71;color:#000;
      font-size:11px;font-weight:900;
      border-radius:100px;padding:2px 8px;
      display:none;box-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    .item-card.has-items .count-badge{display:block;}

    /* ── Photo overlay gradient ── */
    .item-photo::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:40%;
      background:linear-gradient(to top,rgba(0,0,0,.55),transparent);
      pointer-events:none;
    }

    /* ── Info section ── */
    .item-info{
      padding:11px 13px 10px;
      display:flex;flex-direction:column;align-items:center;
      gap:4px;flex:1;
    }
    .item-name{font-size:13px;font-weight:900;text-align:center;color:#e0e0e0;line-height:1.3;}
    .item-price{font-size:13px;font-weight:900;color:#2ecc71;}
    .item-category{font-size:10px;font-weight:800;letter-spacing:1.5px;color:rgba(255,255,255,.22);text-transform:uppercase;}

    /* ── Controls ── */
    .controls{
      display:flex;align-items:center;
      background:#111;border-radius:100px;border:1.5px solid #2a2a2a;
      overflow:hidden;margin-top:6px;
    }
    .ctrl-btn{
      font-family:inherit;font-size:17px;font-weight:900;
      width:36px;height:36px;border:none;cursor:pointer;
      background:transparent;color:#d0d0d0;
      display:grid;place-items:center;
      transition:background .12s,color .12s;
    }
    .ctrl-btn.sell:hover{background:#2a0000;color:#e74c3c;}
    .ctrl-btn.buy:hover{background:#002a00;color:#2ecc71;}
    .ctrl-btn:disabled{opacity:.25;cursor:not-allowed;}
    .ctrl-count{min-width:36px;text-align:center;font-size:14px;font-weight:900;color:#fff;}

    /* ── Spend ticker ── */
    .spent-tick{
      position:fixed;pointer-events:none;
      font-size:15px;font-weight:900;
      animation:tickUp .85s ease forwards;z-index:9999;
    }
    @keyframes tickUp{
      0%{opacity:1;transform:translateY(0) scale(1)}
      80%{opacity:.7}
      100%{opacity:0;transform:translateY(-55px) scale(.8)}
    }

    /* ── Win banner ── */
    #winBanner{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,.88);z-index:200;
      flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:30px;

    #winBanner.show{display:flex;}
    .win-emoji{font-size:68px;margin-bottom:14px;}
    .win-title{font-size:34px;font-weight:900;color:#2ecc71;margin-bottom:8px;}
    .win-sub{font-size:15px;color:#aaa;font-weight:700;margin-bottom:26px;max-width:420px;}

    /* Mobile */
    @media(max-width:480px){
      .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;}
      .item-photo{height:110px;}

    #statusBar{
      position:fixed;bottom:0;left:0;right:0;height:26px;
      display:flex;align-items:center;justify-content:space-between;

    /* ── Cover overlay ── */

      position:fixed;inset:0;z-index:9998;cursor:pointer;
      opacity:0;pointer-events:none;transition:opacity .55s cubic-bezier(.4,0,.2,1);
    }
    #coverOverlay.show{opacity:1;pointer-events:auto;}
    #coverOverlay img{width:100%;height:100%;object-fit:contain;object-position:top center;display:block;}

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
const TOTAL_MONEY = TOTAL;
let money = TOTAL;
let counts = {};
ITEMS.forEach(i=>{ counts[i.id]=0; });
let activeFilter = 'All';

// ─────────────────────────────────────────────
//  Format helpers
// ─────────────────────────────────────────────
function fmt(n){
  if(n<0) return '-'+fmt(-n);
  if(n>=1e12) return '$'+(n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return '$'+(n/1e9).toFixed(2).replace(/\.00$/, '')+'B';
  if(n>=1e6)  return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toLocaleString();
}
function fmtShort(n){
  if(n>=1e9)  return '$'+(n/1e9).toFixed(1)+'B';
  if(n>=1e6)  return '$'+(n/1e6).toFixed(1)+'M';
  if(n>=1e3)  return '$'+(n/1e3).toFixed(0)+'K';
  return '$'+n.toLocaleString();
}

// ─────────────────────────────────────────────
//  Image error handler
// ─────────────────────────────────────────────
function imgErr(img){
  img.style.display='none';
  const fb = img.nextElementSibling;
  if(fb) fb.style.display='flex';
}

// ─────────────────────────────────────────────
//  Render grid
// ─────────────────────────────────────────────
function renderGrid(){
  const grid = document.getElementById('itemGrid');
  grid.innerHTML = '';
  const filtered = activeFilter==='All' ? ITEMS : ITEMS.filter(i=>i.cat===activeFilter);

  filtered.forEach(item=>{
    const canAfford = money >= item.price;
    const owned = counts[item.id] > 0;
    const div = document.createElement('div');
    div.className = 'item-card'+(owned?' has-items':'')+(!canAfford&&!owned?' cant-afford':'');
    div.id = 'card-'+item.id;
    div.innerHTML = `
      <div class="count-badge" id="badge-${item.id}">${counts[item.id]}×</div>
      <div class="item-photo">
        <img src="${item.img}" alt="${item.name}" loading="lazy" onerror="imgErr(this)"/>
        <div class="emoji-fb">${item.emoji}</div>
      </div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${fmtShort(item.price)}</div>
        <div class="item-category">${item.cat}</div>
        <div class="controls">
          <button class="ctrl-btn sell" data-id="${item.id}" ${counts[item.id]===0?'disabled':''}>−</button>
          <span class="ctrl-count" id="count-${item.id}">${counts[item.id]}</span>
          <button class="ctrl-btn buy" data-id="${item.id}" ${!canAfford?'disabled':''}>+</button>
        </div>
      </div>`;
    grid.appendChild(div);
  });
}

function updateHUD(){
  const spent = TOTAL - money;
  const pct = Math.max(0,(money/TOTAL)*100);
  const md = document.getElementById('moneyDisplay');
  md.textContent = money<=0 ? '$0' : fmt(money);
  md.className = money<=0 ? 'low' : money<TOTAL*0.15 ? 'low' : '';
  const fill = document.getElementById('progressFill');
  fill.style.width = pct+'%';
  fill.className = 'progress-fill'+(money<TOTAL*0.15?' low':'');
  document.getElementById('spentDisplay').textContent = fmt(spent);
  document.getElementById('itemCountDisplay').textContent =
    Object.values(counts).reduce((a,b)=>a+b,0).toLocaleString();
}

function refreshCard(id){
  const item = ITEMS.find(i=>i.id===id);
  if(!item) return;
  const canAfford = money >= item.price;
  const owned = counts[id]>0;
  const card = document.getElementById('card-'+id);
  if(!card) return;
  card.className='item-card'+(owned?' has-items':'')+(!canAfford&&!owned?' cant-afford':'');
  document.getElementById('badge-'+id).textContent = counts[id]+'×';
  document.getElementById('count-'+id).textContent = counts[id];
  card.querySelector('.ctrl-btn.buy').disabled = !canAfford;
  card.querySelector('.ctrl-btn.sell').disabled = counts[id]===0;
  // Refresh all buy buttons (money changed)
  document.querySelectorAll('.ctrl-btn.buy').forEach(btn=>{
    const it = ITEMS.find(i=>i.id===btn.dataset.id);
    if(!it) return;
    btn.disabled = money < it.price;
    const c = btn.closest('.item-card');
    if(c && counts[it.id]===0) c.classList.toggle('cant-afford', money<it.price);
  });
}

// ─────────────────────────────────────────────
//  Buy / Sell
// ─────────────────────────────────────────────
function buy(id, e){
  const item = ITEMS.find(i=>i.id===id);
  if(!item||money<item.price) return;
  money -= item.price;
  counts[id]++;
  refreshCard(id);
  updateHUD();
  spawnTick('-'+fmtShort(item.price), e, '#e74c3c');
  if(money<=0) setTimeout(()=>document.getElementById('winBanner').classList.add('show'),500);
}
function sell(id, e){
  const item = ITEMS.find(i=>i.id===id);
  if(!item||counts[id]===0) return;
  money += item.price;
  counts[id]--;
  refreshCard(id);
  updateHUD();
  spawnTick('+'+fmtShort(item.price), e, '#2ecc71');
}

function spawnTick(text, e, color){
  const el = document.createElement('div');
  el.className = 'spent-tick';
  el.textContent = text;
  el.style.color = color;
  const x = e ? Math.min(e.clientX, window.innerWidth-70) : window.innerWidth/2;
  const y = e ? e.clientY-10 : 200;
  el.style.left = x+'px';
  el.style.top  = y+'px';
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

// ─────────────────────────────────────────────
//  Events
// ─────────────────────────────────────────────
document.getElementById('itemGrid').addEventListener('click', e=>{
  const buy_btn  = e.target.closest('.ctrl-btn.buy');
  const sell_btn = e.target.closest('.ctrl-btn.sell');
  if(buy_btn  && !buy_btn.disabled)  buy(buy_btn.dataset.id, e);
  if(sell_btn && !sell_btn.disabled) sell(sell_btn.dataset.id, e);
});

document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  activeFilter = btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
});

// ─────────────────────────────────────────────
//  Reset
// ─────────────────────────────────────────────
function resetGame(){
  money = TOTAL;
  ITEMS.forEach(i=>{ counts[i.id]=0; });
  document.getElementById('winBanner').classList.remove('show');
  renderGrid();
  updateHUD();
}
document.getElementById('resetBtn').addEventListener('click', resetGame);

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
renderGrid();
updateHUD();

// ─────────────────────────────────────────────
//  Cover overlay
// ─────────────────────────────────────────────
function showCover(){
  document.getElementById('coverOverlay').classList.add('show');
  clearTimeout(coverTimer);
}
function hideCover(){
  document.getElementById('coverOverlay').classList.remove('show');
  armCoverTimer();
}
let coverTimer = null;
function isTypingField(){
  const active = document.activeElement;
  return active && active.closest("input, textarea, select, [contenteditable='true']");
}
function armCoverTimer(){
  clearTimeout(coverTimer);
  coverTimer = setTimeout(showCover, 5000);
}
function handleCoverActivity(){
  if(document.getElementById('coverOverlay').classList.contains('show')) hideCover();
  else armCoverTimer();
}
document.addEventListener('keydown',e=>{
  if(!['Backspace','Enter'].includes(e.key)){
    armCoverTimer();
    return;
  }
  if(isTypingField()){
    armCoverTimer();
    return;
  }
  e.preventDefault();
  showCover();
});
["mousemove","mousedown","touchstart","click","wheel"].forEach(evt=>{
  window.addEventListener(evt, handleCoverActivity, { passive:true });
});
armCoverTimer();
</script>
