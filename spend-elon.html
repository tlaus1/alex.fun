<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spend Elon's Money — alex.fun</title>
  <link rel="icon" type="image/png" href="./clever1.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Nunito",Arial,sans-serif;
      background:#0d0d0d;color:#f0f0f0;min-height:100vh;
      display:flex;flex-direction:column;
    }

    /* ── Top bar ── */
    .top-bar{
      display:flex;align-items:center;gap:10px;
      padding:10px 20px;background:#111;
      border-bottom:1px solid #222;flex-shrink:0;position:sticky;top:0;z-index:100;
    }
    .btn{
      font-family:inherit;font-size:13px;font-weight:800;
      color:#f0f0f0;background:transparent;border:1.5px solid #333;
      border-radius:100px;padding:6px 14px;cursor:pointer;
      transition:background .13s,border-color .13s,transform .1s;white-space:nowrap;
    }
    .btn:hover{background:#1e1e1e;border-color:#555;transform:translateY(-1px);}

    /* ── Hero money display ── */
    .hero{
      background:linear-gradient(160deg,#0a1a0a 0%,#001a00 40%,#0a1200 100%);
      padding:32px 24px 28px;text-align:center;position:relative;overflow:hidden;
    }
    .hero::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(0,255,80,.08) 0%,transparent 70%);
      pointer-events:none;
    }
    .hero-label{
      font-size:12px;font-weight:900;letter-spacing:3px;
      color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:6px;
    }
    .hero-name{
      font-size:15px;font-weight:800;color:rgba(255,255,255,.5);margin-bottom:10px;
    }
    #moneyDisplay{
      font-size:clamp(36px,7vw,72px);font-weight:900;
      color:#2ecc71;line-height:1;letter-spacing:-1px;
      text-shadow:0 0 40px rgba(46,204,113,.3);
      transition:color .2s;
    }
    #moneyDisplay.low{color:#e74c3c;text-shadow:0 0 40px rgba(231,76,60,.3);}
    #moneyDisplay.zero{color:#c0392b;}

    /* ── Progress bar ── */
    .progress-wrap{
      background:#111;border-radius:100px;height:8px;
      margin:16px auto 0;max-width:600px;overflow:hidden;
    }
    .progress-fill{
      height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);
      border-radius:100px;transition:width .4s ease;width:100%;
    }
    .progress-fill.low{background:linear-gradient(90deg,#c0392b,#e74c3c);}
    .hero-stats{
      display:flex;gap:24px;justify-content:center;margin-top:14px;flex-wrap:wrap;
    }
    .stat{font-size:13px;font-weight:800;color:rgba(255,255,255,.45);}
    .stat span{color:rgba(255,255,255,.8);}

    /* ── Category filter ── */
    .filters{
      display:flex;gap:8px;padding:16px 20px;overflow-x:auto;
      background:#111;border-bottom:1px solid #1a1a1a;
      scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{display:none;}
    .filter-btn{
      font-family:inherit;font-size:12px;font-weight:800;
      padding:6px 14px;border-radius:100px;border:1.5px solid #2a2a2a;
      background:#1a1a1a;color:rgba(255,255,255,.55);cursor:pointer;
      white-space:nowrap;transition:all .15s;flex-shrink:0;
    }
    .filter-btn:hover{border-color:#3a3a3a;color:rgba(255,255,255,.8);}
    .filter-btn.active{background:#2ecc71;border-color:#2ecc71;color:#000;}

    /* ── Item grid ── */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      gap:14px;padding:20px;
    }

    /* ── Item card ── */
    .item-card{
      background:#161616;border:1.5px solid #222;
      border-radius:16px;padding:18px 16px 14px;
      display:flex;flex-direction:column;align-items:center;
      gap:8px;transition:border-color .15s,transform .15s,background .15s;
      position:relative;
    }
    .item-card:hover{border-color:#2ecc71;background:#1a1a1a;transform:translateY(-2px);}
    .item-card.has-items{border-color:#27ae60;background:#0f1a0f;}
    .item-card.cant-afford{opacity:.45;pointer-events:none;}

    .item-emoji{font-size:40px;line-height:1;margin-bottom:2px;}
    .item-name{
      font-size:13px;font-weight:900;text-align:center;
      color:#e0e0e0;line-height:1.3;
    }
    .item-price{
      font-size:12px;font-weight:800;color:#2ecc71;
    }
    .item-category{
      font-size:10px;font-weight:800;letter-spacing:1.5px;
      color:rgba(255,255,255,.25);text-transform:uppercase;
    }

    /* ── Buy/Sell controls ── */
    .controls{
      display:flex;align-items:center;gap:0;
      background:#111;border-radius:100px;border:1.5px solid #2a2a2a;
      overflow:hidden;margin-top:4px;
    }
    .ctrl-btn{
      font-family:inherit;font-size:16px;font-weight:900;
      width:36px;height:36px;border:none;cursor:pointer;
      background:transparent;color:#e0e0e0;
      display:grid;place-items:center;
      transition:background .12s,color .12s;
    }
    .ctrl-btn.sell:hover{background:#2a0000;color:#e74c3c;}
    .ctrl-btn.buy:hover{background:#002a00;color:#2ecc71;}
    .ctrl-btn:disabled{opacity:.3;cursor:not-allowed;}
    .ctrl-count{
      min-width:36px;text-align:center;
      font-size:14px;font-weight:900;color:#fff;
    }

    /* ── Count badge ── */
    .count-badge{
      position:absolute;top:10px;right:10px;
      background:#2ecc71;color:#000;
      font-size:11px;font-weight:900;
      border-radius:100px;padding:2px 7px;
      display:none;
    }
    .item-card.has-items .count-badge{display:block;}

    /* ── Spent ticker ── */
    .spent-tick{
      position:fixed;pointer-events:none;
      font-size:16px;font-weight:900;
      animation:tickUp .9s ease forwards;z-index:9999;
    }
    @keyframes tickUp{
      0%{opacity:1;transform:translateY(0) scale(1)}
      80%{opacity:.7}
      100%{opacity:0;transform:translateY(-60px) scale(.8)}
    }

    /* ── Win banner ── */
    #winBanner{
      display:none;position:fixed;top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,.85);z-index:200;
      flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:30px;
    }
    #winBanner.show{display:flex;}
    .win-emoji{font-size:72px;margin-bottom:16px;}
    .win-title{font-size:36px;font-weight:900;color:#2ecc71;margin-bottom:8px;}
    .win-sub{font-size:16px;color:#aaa;font-weight:700;margin-bottom:28px;max-width:440px;}

    /* ── Toast ── */
    #toast{
      position:fixed;bottom:20px;left:50%;
      transform:translateX(-50%) translateY(20px);
      background:#2ecc71;color:#000;font-size:14px;font-weight:900;
      padding:10px 22px;border-radius:100px;
      opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
      z-index:300;white-space:nowrap;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* Mobile */
    @media(max-width:500px){
      .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;}
      .item-emoji{font-size:32px;}
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="btn" onclick="location.href='./index.html'">← Back</button>
  <span style="flex:1;font-weight:900;font-size:15px;">Spend Elon's Money</span>
  <button class="btn" id="resetBtn">Reset</button>
</div>

<div class="hero">
  <div class="hero-label">💸 Elon Musk's Net Worth</div>
  <div class="hero-name">$321,700,000,000</div>
  <div id="moneyDisplay">$321.7B</div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="hero-stats">
    <div class="stat">Spent: <span id="spentDisplay">$0</span></div>
    <div class="stat">Items bought: <span id="itemCountDisplay">0</span></div>
  </div>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-cat="All">All</button>
  <button class="filter-btn" data-cat="Everyday">Everyday</button>
  <button class="filter-btn" data-cat="Tech">Tech</button>
  <button class="filter-btn" data-cat="Cars">Cars</button>
  <button class="filter-btn" data-cat="Air & Sea">Air & Sea</button>
  <button class="filter-btn" data-cat="Real Estate">Real Estate</button>
  <button class="filter-btn" data-cat="Athletes">Athletes</button>
  <button class="filter-btn" data-cat="Sports Teams">Sports Teams</button>
  <button class="filter-btn" data-cat="Wild">Wild</button>
</div>

<div class="grid" id="itemGrid"></div>
<div id="winBanner">
  <div class="win-emoji">🎉</div>
  <div class="win-title">Money Gone!</div>
  <div class="win-sub">You spent all $321.7 billion of Elon Musk's fortune. That's some serious shopping.</div>
  <button class="btn" onclick="resetGame()" style="font-size:15px;padding:12px 28px;border-color:#2ecc71;color:#2ecc71;">Spend Again</button>
</div>
<div id="toast"></div>

<script>
const TOTAL = 321_700_000_000;

const ITEMS = [
  // Everyday
  { id:'bigmac',    emoji:'🍔', name:'Big Mac',               price:5,                cat:'Everyday' },
  { id:'coffee',    emoji:'☕', name:'Starbucks Coffee',       price:6,                cat:'Everyday' },
  { id:'pizza',     emoji:'🍕', name:'Pizza',                  price:20,               cat:'Everyday' },
  { id:'netflix',   emoji:'📺', name:'Netflix (1 month)',      price:15,               cat:'Everyday' },
  { id:'airpods',   emoji:'🎧', name:'AirPods Pro',            price:249,              cat:'Everyday' },
  { id:'sneakers',  emoji:'👟', name:'Nike Air Jordan 1',      price:300,              cat:'Everyday' },
  { id:'superbowl', emoji:'🏆', name:'Super Bowl Ring',        price:36_000,           cat:'Everyday' },

  // Tech
  { id:'switch',    emoji:'🎮', name:'Nintendo Switch',        price:299,              cat:'Tech' },
  { id:'ps5',       emoji:'🕹️', name:'PlayStation 5',          price:499,              cat:'Tech' },
  { id:'xbox',      emoji:'🎮', name:'Xbox Series X',          price:499,              cat:'Tech' },
  { id:'iphone',    emoji:'📱', name:'iPhone 16 Pro Max',      price:1_199,            cat:'Tech' },
  { id:'visionpro', emoji:'🥽', name:'Apple Vision Pro',       price:3_499,            cat:'Tech' },
  { id:'gaming_pc', emoji:'🖥️', name:'Gaming PC (RTX 4090)',   price:4_500,            cat:'Tech' },
  { id:'tesla',     emoji:'⚡', name:'Tesla Model S Plaid',    price:89_990,           cat:'Tech' },

  // Cars
  { id:'civic',     emoji:'🚗', name:'Honda Civic',            price:25_000,           cat:'Cars' },
  { id:'lambo',     emoji:'🏎️', name:'Lamborghini Urus',       price:250_000,          cat:'Cars' },
  { id:'ferrari',   emoji:'🏎️', name:'Ferrari SF90',           price:525_000,          cat:'Cars' },
  { id:'mclaren',   emoji:'🏎️', name:'McLaren P1',             price:1_150_000,        cat:'Cars' },
  { id:'bugatti',   emoji:'🏎️', name:'Bugatti Chiron',         price:3_000_000,        cat:'Cars' },
  { id:'rolsroyce', emoji:'🚘', name:'Rolls-Royce Boat Tail',  price:28_000_000,       cat:'Cars' },
  { id:'koenigsegg',emoji:'🏎️', name:'Koenigsegg Agera RS',    price:10_000_000,       cat:'Cars' },
  { id:'f1car',     emoji:'🏁', name:'Formula 1 Car',          price:15_000_000,       cat:'Cars' },

  // Air & Sea
  { id:'helicopter',emoji:'🚁', name:'Helicopter',             price:3_000_000,        cat:'Air & Sea' },
  { id:'submarine', emoji:'🤿', name:'Private Submarine',      price:25_000_000,       cat:'Air & Sea' },
  { id:'jet',       emoji:'✈️', name:'Gulfstream G700 Jet',    price:75_000_000,       cat:'Air & Sea' },
  { id:'yacht',     emoji:'🛥️', name:'Superyacht (90m)',        price:300_000_000,      cat:'Air & Sea' },
  { id:'cruiseship',emoji:'🚢', name:'Cruise Ship',            price:1_500_000_000,    cat:'Air & Sea' },

  // Real Estate
  { id:'house',     emoji:'🏠', name:'Average US House',       price:400_000,          cat:'Real Estate' },
  { id:'penthouse', emoji:'🏙️', name:'NYC Penthouse',          price:42_000_000,       cat:'Real Estate' },
  { id:'mansion',   emoji:'🏡', name:'Luxury Mansion',         price:100_000_000,      cat:'Real Estate' },
  { id:'island',    emoji:'🏝️', name:'Private Island',         price:85_000_000,       cat:'Real Estate' },
  { id:'skyscraper',emoji:'🏢', name:'NYC Skyscraper',         price:500_000_000,      cat:'Real Estate' },
  { id:'palace',    emoji:'🏰', name:'Buckingham Palace (est.)',price:5_000_000_000,   cat:'Real Estate' },

  // Athletes (annual earnings)
  { id:'messi',     emoji:'⚽', name:'Lionel Messi (1yr)',     price:135_000_000,      cat:'Athletes' },
  { id:'ronaldo',   emoji:'⚽', name:'Cristiano Ronaldo (1yr)',price:200_000_000,      cat:'Athletes' },
  { id:'mbappe',    emoji:'⚽', name:'Kylian Mbappé (1yr)',    price:180_000_000,      cat:'Athletes' },
  { id:'lebron',    emoji:'🏀', name:'LeBron James (1yr)',     price:128_000_000,      cat:'Athletes' },
  { id:'curry',     emoji:'🏀', name:'Stephen Curry (1yr)',    price:55_000_000,       cat:'Athletes' },
  { id:'taylor',    emoji:'🎤', name:'Taylor Swift (1yr tour)',price:1_000_000_000,    cat:'Athletes' },

  // Sports Teams
  { id:'nbateam',   emoji:'🏀', name:'NBA Team (avg)',         price:3_850_000_000,    cat:'Sports Teams' },
  { id:'nflteam',   emoji:'🏈', name:'NFL Team (avg)',         price:4_690_000_000,    cat:'Sports Teams' },
  { id:'mlbteam',   emoji:'⚾', name:'MLB Team (avg)',         price:2_100_000_000,    cat:'Sports Teams' },
  { id:'premclub',  emoji:'⚽', name:'Premier League Club',    price:2_000_000_000,    cat:'Sports Teams' },
  { id:'f1team',    emoji:'🏁', name:'F1 Team',               price:900_000_000,      cat:'Sports Teams' },

  // Wild
  { id:'spacex',    emoji:'🚀', name:'SpaceX Launch',          price:67_000_000,       cat:'Wild' },
  { id:'casino',    emoji:'🎰', name:'Las Vegas Casino Resort',price:250_000_000,      cat:'Wild' },
  { id:'zoo',       emoji:'🦁', name:'San Diego Zoo',          price:500_000_000,      cat:'Wild' },
  { id:'monalisa',  emoji:'🎨', name:'Mona Lisa (est.)',        price:860_000_000,      cat:'Wild' },
  { id:'carrier',   emoji:'⚓', name:'Aircraft Carrier',       price:13_000_000_000,   cat:'Wild' },
  { id:'disneyworld',emoji:'🎢', name:'Disney World',          price:60_000_000_000,   cat:'Wild' },
  { id:'nasa',      emoji:'🌕', name:'NASA Moon Mission',      price:93_000_000_000,   cat:'Wild' },
];

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let money = TOTAL;
let counts = {};
ITEMS.forEach(i=>{ counts[i.id]=0; });

let activeFilter = 'All';

// ─────────────────────────────────────────────
//  Format helpers
// ─────────────────────────────────────────────
function fmt(n){
  if(n<0) return '-'+fmt(-n);
  if(n>=1e12) return '$'+(n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return '$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toLocaleString();
}
function fmtFull(n){
  if(n<0) return '-'+fmtFull(-n);
  return '$'+Math.abs(n).toLocaleString();
}
function fmtShort(n){
  if(n>=1e9)  return '$'+(n/1e9).toFixed(1)+'B';
  if(n>=1e6)  return '$'+(n/1e6).toFixed(1)+'M';
  if(n>=1e3)  return '$'+(n/1e3).toFixed(0)+'K';
  return '$'+n.toLocaleString();
}

// ─────────────────────────────────────────────
//  Render
// ─────────────────────────────────────────────
function renderGrid(){
  const grid = document.getElementById('itemGrid');
  grid.innerHTML = '';
  const filtered = activeFilter==='All' ? ITEMS : ITEMS.filter(i=>i.cat===activeFilter);

  filtered.forEach(item=>{
    const canAfford = money >= item.price;
    const owned = counts[item.id] > 0;
    const div = document.createElement('div');
    div.className = 'item-card' + (owned?' has-items':'') + (!canAfford&&!owned?' cant-afford':'');
    div.id = 'card-'+item.id;
    div.innerHTML = `
      <div class="count-badge" id="badge-${item.id}">${counts[item.id]}×</div>
      <div class="item-emoji">${item.emoji}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-price">${fmtShort(item.price)}</div>
      <div class="item-category">${item.cat}</div>
      <div class="controls">
        <button class="ctrl-btn sell" data-id="${item.id}" ${counts[item.id]===0?'disabled':''}>−</button>
        <span class="ctrl-count" id="count-${item.id}">${counts[item.id]}</span>
        <button class="ctrl-btn buy" data-id="${item.id}" ${!canAfford?'disabled':''}>+</button>
      </div>`;
    grid.appendChild(div);
  });
}

function updateHUD(){
  const spent = TOTAL - money;
  const pct = Math.max(0, (money / TOTAL) * 100);

  // Money display
  const md = document.getElementById('moneyDisplay');
  if(money <= 0){
    md.textContent = '$0';
    md.className = 'zero';
  } else if(money < TOTAL*0.15){
    md.textContent = fmt(money);
    md.className = 'low';
  } else {
    md.textContent = fmt(money);
    md.className = '';
  }

  // Progress
  const fill = document.getElementById('progressFill');
  fill.style.width = pct+'%';
  fill.className = 'progress-fill' + (money < TOTAL*0.15?' low':'');

  document.getElementById('spentDisplay').textContent = fmt(spent);
  const totalItems = Object.values(counts).reduce((a,b)=>a+b,0);
  document.getElementById('itemCountDisplay').textContent = totalItems.toLocaleString();
}

function updateCard(id){
  const item = ITEMS.find(i=>i.id===id);
  if(!item) return;
  const canAfford = money >= item.price;
  const owned = counts[id] > 0;

  const card = document.getElementById('card-'+id);
  if(card){
    card.className = 'item-card'+(owned?' has-items':'')+((!canAfford&&!owned)?' cant-afford':'');
    const badge = document.getElementById('badge-'+id);
    if(badge) badge.textContent = counts[id]+'×';
    const countEl = document.getElementById('count-'+id);
    if(countEl) countEl.textContent = counts[id];
    const buyBtn = card.querySelector('.ctrl-btn.buy');
    const sellBtn = card.querySelector('.ctrl-btn.sell');
    if(buyBtn) buyBtn.disabled = !canAfford;
    if(sellBtn) sellBtn.disabled = counts[id]===0;
  }

  // Update all "buy" buttons affordability (money changed)
  document.querySelectorAll('.ctrl-btn.buy').forEach(btn=>{
    const itm = ITEMS.find(i=>i.id===btn.dataset.id);
    if(!itm) return;
    btn.disabled = money < itm.price;
    const c = btn.closest('.item-card');
    if(c && counts[itm.id]===0){
      c.classList.toggle('cant-afford', money < itm.price);
    }
  });
}

// ─────────────────────────────────────────────
//  Buy / Sell
// ─────────────────────────────────────────────
function buy(id, e){
  const item = ITEMS.find(i=>i.id===id);
  if(!item || money < item.price) return;
  money -= item.price;
  counts[id]++;
  updateCard(id);
  updateHUD();
  spawnTick('+'+fmtShort(item.price), e, '#e74c3c');
  if(money<=0) setTimeout(()=>document.getElementById('winBanner').classList.add('show'),600);
}

function sell(id, e){
  const item = ITEMS.find(i=>i.id===id);
  if(!item || counts[id]===0) return;
  money += item.price;
  counts[id]--;
  updateCard(id);
  updateHUD();
  spawnTick('+'+fmtShort(item.price), e, '#2ecc71');
}

// ─────────────────────────────────────────────
//  Spend ticker animation
// ─────────────────────────────────────────────
function spawnTick(text, e, color){
  const el = document.createElement('div');
  el.className = 'spent-tick';
  el.textContent = text;
  el.style.color = color;
  const x = e ? Math.min(e.clientX, window.innerWidth-60) : window.innerWidth/2;
  const y = e ? e.clientY - 10 : 200;
  el.style.left = x+'px';
  el.style.top  = y+'px';
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

// ─────────────────────────────────────────────
//  Event delegation
// ─────────────────────────────────────────────
document.getElementById('itemGrid').addEventListener('click', e=>{
  const buyBtn  = e.target.closest('.ctrl-btn.buy');
  const sellBtn = e.target.closest('.ctrl-btn.sell');
  if(buyBtn && !buyBtn.disabled)  buy(buyBtn.dataset.id, e);
  if(sellBtn && !sellBtn.disabled) sell(sellBtn.dataset.id, e);
});

// ─────────────────────────────────────────────
//  Filters
// ─────────────────────────────────────────────
document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  activeFilter = btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
});

// ─────────────────────────────────────────────
//  Reset
// ─────────────────────────────────────────────
function resetGame(){
  money = TOTAL;
  ITEMS.forEach(i=>{ counts[i.id]=0; });
  document.getElementById('winBanner').classList.remove('show');
  renderGrid();
  updateHUD();
}
