<!DOCTYPE html>
<!-- Loads game assets from local repo (Build/, StreamingAssets/, TemplateData/).
     CDN-hosted version doesn't reliably load weapons / weapon UIs on GitHub Pages. -->
<html lang="en-us">
<head>
  <script>
    // Build.framework.js's audio/visibility callbacks fire during early Unity
    // boot and reference a bare `unityGameInstance` global. Declare it on the
    // window before ANY other script runs so accessing it never throws.
    Object.defineProperty(window, 'unityGameInstance', {
      value: null, writable: true, configurable: true, enumerable: true
    });
  </script>
  <script src="./cover-profiles.js"></script>
  <link rel="icon" type="image/png" href="./clever1.png">
  <script>
    // Block ytgame.js from redirecting to its localhost dev server (port 8765)
    // when it detects it's not running inside YouTube's iframe.
    (function () {
      var _replace = Location.prototype.replace;
      Location.prototype.replace = function (url) {
        if (typeof url === 'string' && /127\.0\.0\.1|localhost/.test(url)) return;
        return _replace.call(this, url);
      };
      var _assign = Location.prototype.assign;
      Location.prototype.assign = function (url) {
        if (typeof url === 'string' && /127\.0\.0\.1|localhost/.test(url)) return;
        return _assign.call(this, url);
      };
    })();
  </script>
  <!-- Real YouTube Playables SDK. Provides every window.ytgame.* API the Unity
       build requires; a hand-rolled stub kept hanging on the splash screen. -->
  <script src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/ytgame.js"></script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Solar Smash</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    :root { --status-h: 24px; --panel: rgba(3,7,18,.82); --fg: #f8fafc; --border: rgba(255,255,255,.18); }
    #unity-container { bottom: var(--status-h) !important; height: calc(100% - var(--status-h)) !important; }
    #coverOverlay {
      position: fixed; inset: 0; z-index: 10000;
      background: #fff; opacity: 0; pointer-events: none;
      transition: opacity .45s cubic-bezier(.4,0,.2,1); cursor: pointer;
    }
    #coverOverlay.show { opacity: 1; pointer-events: auto; }
    #coverOverlay img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .alex-topbar {
      position: fixed; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      pointer-events: none; z-index: 9000;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .alex-actions { display: flex; gap: 8px; pointer-events: auto; }
    .alex-title {
      max-width: 44vw; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--panel); backdrop-filter: blur(12px); box-shadow: 0 8px 22px rgba(0,0,0,.32);
      font-size: 12px; font-weight: 900; color: var(--fg); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; pointer-events: none;
    }
    .alex-btn {
      appearance: none; border: 1px solid var(--border); border-radius: 999px;
      background: var(--panel); color: var(--fg); padding: 8px 12px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 900;
      cursor: pointer; backdrop-filter: blur(12px); box-shadow: 0 8px 22px rgba(0,0,0,.32);
    }
    .alex-btn:hover { background: rgba(15,23,42,.92); }
    #alexStatusBar {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--status-h);
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
      background: #030712; border-top: 1px solid rgba(255,255,255,.1);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 800;
      color: rgba(248,250,252,.6); z-index: 9100;
    }
    #alexStatusBar .sb-cover { cursor: pointer; user-select: none; }
    #alexStatusBar .sb-cover:hover { color: var(--fg); }
  </style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=100% height=100% tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
  </div>

  <script>
    // Merge multi-part files (planets, planets2, Build.wasm) from local repo.
    // GitHub's 100MB per-file limit forces splitting large WASM/asset-bundles.
    function mergeFiles(fileParts) {
      return Promise.all(fileParts.map(p => fetch(p).then(r => r.arrayBuffer())))
        .then(buffers => new Blob(buffers, { type: "application/octet-stream" }));
    }
    function getNumberedParts(file, start, end) {
      const parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }
    function getLetteredParts(file, letters) {
      return letters.map(l => file + ".part." + l);
    }

    const originalFetch = window.fetch.bind(window);

    window.__solarSmashAssets = Promise.all([
      mergeFiles(getNumberedParts("StreamingAssets/AssetBundles/WebGL/planets",  1, 2)),
      mergeFiles(getNumberedParts("StreamingAssets/AssetBundles/WebGL/planets2", 1, 2)),
      mergeFiles(getLetteredParts("Build/Build.wasm", ["aa", "ab", "ac", "ad", "ae"]))
    ]).then(([planets1, planets2, wasmBlob]) => {
      const wasmUrl = URL.createObjectURL(new Blob([wasmBlob], { type: "application/wasm" }));

      window.fetch = function (...args) {
        const url = args[0];
        if (typeof url === "string" && url.includes("StreamingAssets/AssetBundles/WebGL/planets")) {
          if (url.includes("planets2")) return Promise.resolve(new Response(planets2, { status: 200 }));
          if (url.includes("planets3")) return originalFetch(...args);
          return Promise.resolve(new Response(planets1, { status: 200 }));
        }
        return originalFetch(...args);
      };

      return { wasmUrl };
    });
  </script>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

    function unityShowBanner(msg, type) {}

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build.loader.js";
    var config = {
      dataUrl:           buildUrl + "/Build.data",
      frameworkUrl:      buildUrl + "/Build.framework.js",
      codeUrl:           buildUrl + "/Build.wasm",   // overridden below with merged blob URL
      streamingAssetsUrl: "StreamingAssets",
      companyName:       "Paradyme Games",
      productName:       "Live - Solar Smash YouTube",
      productVersion:    "0.1.0",
      showBanner:        unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    loadingBar.style.display = "block";

    // The Unity build's framework.js references a global `unityGameInstance`
    // from audio/visibility callbacks that fire during init — before our
    // .then() assignment runs. Declaring it upfront prevents a ReferenceError.
    var unityGameInstance = null;
    window.unityGameInstance = unityGameInstance;

    function InitUnitySection() {
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          unityGameInstance = unityInstance;
          window.unityGameInstance = unityInstance;
          loadingBar.style.display = "none";
        }).catch((message) => {
          console.error(message);
        });
      };
      document.body.appendChild(script);
    }

    window.__solarSmashAssets.then(({ wasmUrl }) => {
      config.codeUrl = wasmUrl;
      InitUnitySection();
    }).catch(err => {
      console.error("Solar Smash asset merge failed:", err);
    });
  </script>

  <div class="alex-topbar">
    <div class="alex-actions">
      <button class="alex-btn" id="alexBackBtn" type="button">Back</button>
    </div>
    <div class="alex-title">Solar Smash</div>
    <div class="alex-actions">
      <button class="alex-btn" id="alexFullscreenBtn" type="button">Fullscreen</button>
    </div>
  </div>

  <div id="coverOverlay" aria-hidden="true">
    <img data-cover-image alt="Cover">
  </div>

  <div id="alexStatusBar">
    <span>Solar Smash</span>
    <span class="sb-cover" id="alexCoverHint">Backspace Cover Image</span>
  </div>

  <script>
    document.getElementById('alexBackBtn').addEventListener('click', function () {
      window.location.href = new URL('index.html', window.location.href).href;
    });

    var alexFsBtn = document.getElementById('alexFullscreenBtn');
    alexFsBtn.addEventListener('click', function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(function () { alexFsBtn.textContent = 'Exit Fullscreen'; }).catch(function(){});
      } else {
        document.exitFullscreen().then(function () { alexFsBtn.textContent = 'Fullscreen'; }).catch(function(){});
      }
    });
    document.addEventListener('fullscreenchange', function () {
      alexFsBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    });

    var coverOverlay = document.getElementById('coverOverlay');
    function toggleCover() {
      var showing = coverOverlay.classList.toggle('show');
      coverOverlay.setAttribute('aria-hidden', String(!showing));
    }
    coverOverlay.addEventListener('click', toggleCover);
    document.getElementById('alexCoverHint').addEventListener('click', toggleCover);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        toggleCover();
      }
    });
  </script>
</body>
</html>
