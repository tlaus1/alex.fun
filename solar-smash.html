<!doctype html>
<html lang="en-us">
<head>
  <script>
    if (location.protocol === "file:") {
      location.replace("http://127.0.0.1:8765/solar-smash.html");
    }
  </script>
  <script src="./cover-profiles.js"></script>
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Solar Smash — alex.fun</title>
  <link rel="icon" type="image/png" href="./clever1.png">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    :root {
      --control-fg: #12131a;
      --control-bg: rgba(255,255,255,.9);
      --control-bg-hover: #fff;
      --control-border: rgba(18,19,26,.18);
      --control-shadow: rgba(0,0,0,.18);
      --status-h: 26px;
    }
    [data-theme="dark"] {
      --control-fg: #ececec;
      --control-bg: rgba(24,24,30,.9);
      --control-bg-hover: #292936;
      --control-border: rgba(255,255,255,.18);
      --control-shadow: rgba(0,0,0,.38);
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03040a;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      animation: pageIn .32s ease both;
    }
    @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
    #unity-container {
      position: fixed;
      inset: 0 0 var(--status-h) 0;
      width: 100%;
      height: auto;
      background: #03040a;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #03040a;
    }
    .game-bar {
      position: fixed;
      left: 14px;
      top: 14px;
      z-index: 100000;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .game-bar button {
      font: 800 13px Arial, sans-serif;
      color: var(--control-fg);
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--control-shadow);
      transition: background .15s, border-color .15s, color .15s, transform .12s;
    }
    .game-bar button:hover {
      background: var(--control-bg-hover);
      transform: translateY(-1px);
    }
    #coverOverlay {
      position: fixed;
      inset: 0;
      z-index: 200000;
      background: #fff;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .55s cubic-bezier(.4, 0, .2, 1);
    }
    #coverOverlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    #coverOverlay img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      object-position: top center;
      display: block;
    }
    #statusBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--status-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--control-bg);
      border-top: 1px solid var(--control-border);
      color: rgba(18,19,26,.68);
      font: 800 11px Arial, sans-serif;
      z-index: 100000;
    }
    #statusBar .sb-cover {
      cursor: pointer;
      user-select: none;
    }
    #statusBar .sb-cover:hover {
      color: var(--control-fg);
    }
    [data-theme="dark"] #statusBar {
      color: rgba(236,236,236,.68);
    }
  </style>
</head>
<body>
  <div class="game-bar">
    <button id="backBtn" type="button">Back</button>
    <button id="fullscreenBtn" type="button">Fullscreen</button>
  </div>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <div id="coverOverlay" aria-hidden="true">
    <img id="coverImage" alt="Solar Smash cover">
  </div>
  <div id="statusBar">
    <span class="sb-cover" onclick="showCover()">⌫ Cover Image</span>
    <span>v1.0.0</span>
  </div>

  <script>
    "use strict";

    const backBtn = document.getElementById("backBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const coverOverlay = document.getElementById("coverOverlay");
    let coverTimer = null;
    let unityLoaded = false;

    function syncTheme() {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
    }

    function showCover() {
      coverOverlay.classList.add("show");
      coverOverlay.setAttribute("aria-hidden", "false");
      clearTimeout(coverTimer);
    }

    function hideCover() {
      coverOverlay.classList.remove("show");
      coverOverlay.setAttribute("aria-hidden", "true");
      armCoverTimer();
    }

    function armCoverTimer() {
      if (!unityLoaded) return;
      clearTimeout(coverTimer);
      coverTimer = setTimeout(showCover, 5000);
    }

    function handleCoverActivity() {
      if (coverOverlay.classList.contains("show")) {
        return;
      } else {
        armCoverTimer();
      }
    }

    function isTypingField() {
      const active = document.activeElement;
      return active && active.closest("input, textarea, select, [contenteditable='true']");
    }

    backBtn.addEventListener("click", () => {
      location.href = new URL("index.html", window.location.href).href;
    });

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = "Exit Fullscreen";
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = "Fullscreen";
        }
      } catch (e) {
        console.log("Fullscreen failed:", e);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.textContent = document.fullscreenElement ? "Exit Fullscreen" : "Fullscreen";
    });

    coverOverlay.addEventListener("click", hideCover);
    window.addEventListener("storage", e => {
      if (e.key === "theme") syncTheme();
    });
    document.addEventListener("keydown", e => {
      if (e.key !== "Backspace") {
        armCoverTimer();
        return;
      }
      if (isTypingField()) {
        armCoverTimer();
        return;
      }
      e.preventDefault();
      showCover();
    }, true);
    ["mousemove","mousedown","touchstart","click","wheel"].forEach(evt => {
      window.addEventListener(evt, handleCoverActivity, { passive: true });
    });
    syncTheme();

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      console[type === "error" ? "error" : "warn"](msg);
      warningBanner.textContent = msg;
      warningBanner.style.display = "block";
      if (type !== "error") {
        setTimeout(() => {
          warningBanner.textContent = "";
          warningBanner.style.display = "none";
        }, 5000);
      }
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Build.loader.js";
    const config = {
      dataUrl: buildUrl + "/Build.data",
      frameworkUrl: buildUrl + "/Build.framework.js",
      codeUrl: buildUrl + "/Build.wasm.part.aa",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Paradyme Games",
      productName: "Live - Solar Smash YouTube",
      productVersion: "0.1.0",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    loadingBar.style.display = "block";

    let unityGameInstance = null;
    let wasmBlobUrl = "";
    async function createSplitWasmUrl() {
      if (wasmBlobUrl) return wasmBlobUrl;
      const parts = [
        buildUrl + "/Build.wasm.part.aa",
        buildUrl + "/Build.wasm.part.ab",
        buildUrl + "/Build.wasm.part.ac",
        buildUrl + "/Build.wasm.part.ad",
        buildUrl + "/Build.wasm.part.ae"
      ];
      const buffers = [];
      for (const part of parts) {
        const response = await fetch(part);
        if (!response.ok) throw new Error(`Could not load ${part}`);
        buffers.push(await response.arrayBuffer());
      }
      wasmBlobUrl = URL.createObjectURL(new Blob(buffers, { type: "application/wasm" }));
      return wasmBlobUrl;
    }

    function initUnitySection() {
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        config.codeUrl = await createSplitWasmUrl();
        createUnityInstance(canvas, config, progress => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(unityInstance => {
          unityGameInstance = unityInstance;
          loadingBar.style.display = "none";
          unityLoaded = true;
          armCoverTimer();
        }).catch(message => {
          console.error(message);
        });
      };
      document.body.appendChild(script);
    }

    const originalFetch = window.fetch.bind(window);
    const assetBundleBases = [
      "https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@a2e4bb68955f2665d16669bbbf7be3123870c2e0/solar-smash/StreamingAssets/AssetBundles/WebGL/",
      "https://rawcdn.githack.com/bubbls/youtube-playables/a2e4bb68955f2665d16669bbbf7be3123870c2e0/solar-smash/StreamingAssets/AssetBundles/WebGL/"
    ];
    const splitBundles = new Map();

    function getAssetBundleName(input) {
      const value = typeof input === "string" ? input : (input && input.url);
      if (!value) return null;
      const match = value.match(/(?:StreamingAssets\/)?AssetBundles\/WebGL\/([^?#]+)/);
      return match ? match[1] : null;
    }

    function shouldUseRemoteBundleFallback() {
      const localHosts = ["", "localhost", "127.0.0.1", "::1"];
      return location.protocol !== "file:" && !localHosts.includes(location.hostname) && navigator.onLine !== false;
    }

    async function mergeBundleParts(bundleName, partCount) {
      const buffers = [];
      for (let i = 1; i <= partCount; i += 1) {
        const response = await fetchBundleCandidate(`${bundleName}.part${i}`);
        if (!response.ok) throw new Error(`Could not load ${bundleName}.part${i}`);
        buffers.push(await response.arrayBuffer());
      }
      splitBundles.set(bundleName, new Blob(buffers, { type: "application/octet-stream" }));
    }

    async function fetchBundleCandidate(path, options) {
      let lastError = null;
      for (const base of assetBundleBases) {
        try {
          const response = await originalFetch(base + path, options);
          if (response.ok) return response;
          lastError = new Error(`${path} returned ${response.status}`);
        } catch (error) {
          lastError = error;
        }
      }
      if (lastError) throw lastError;
      throw new Error(`Could not load ${path}`);
    }

    async function loadLazySplitBundle(bundleName) {
      if (splitBundles.has(bundleName)) return splitBundles.get(bundleName);
      const buffers = [];
      for (let i = 1; i <= 32; i += 1) {
        let response = null;
        try {
          response = await fetchBundleCandidate(`${bundleName}.part${i}`);
        } catch {
          break;
        }
        buffers.push(await response.arrayBuffer());
      }
      if (!buffers.length) return null;
      const blob = new Blob(buffers, { type: "application/octet-stream" });
      splitBundles.set(bundleName, blob);
      return blob;
    }

    async function loadBundleResponse(bundleName, options, originalInput) {
      if (originalInput) {
        try {
          const localResponse = await originalFetch(originalInput, options);
          if (localResponse.ok) return localResponse;
        } catch (error) {
          console.log("Solar Smash local bundle load failed:", bundleName, error);
        }
      }
      try {
        return await fetchBundleCandidate(bundleName, options);
      } catch (error) {
        console.log("Solar Smash bundle direct load failed:", bundleName, error);
      }
      const splitBundle = await loadLazySplitBundle(bundleName);
      if (splitBundle) {
        return new Response(splitBundle, {
          status: 200,
          headers: { "Content-Type": "application/octet-stream" }
        });
      }
      throw new Error(`Could not load Solar Smash asset bundle: ${bundleName}`);
    }

    function rewriteSolarSmashUrl(input) {
      const value = typeof input === "string" ? input : (input && input.url);
      if (!value) return input;
      const match = value.match(/(?:StreamingAssets\/)?AssetBundles\/WebGL\/([^?#]+)/);
      if (!match) return input;
      const rewritten = assetBundleBases[0] + match[1];
      return typeof input === "string" ? rewritten : new Request(rewritten, input);
    }

    window.fetch = async function(input, options) {
      const bundleName = getAssetBundleName(input);
      if (bundleName && !shouldUseRemoteBundleFallback()) {
        return originalFetch(input, options);
      }
      if (bundleName) {
        return loadBundleResponse(bundleName, options, input);
      }
      return originalFetch(input, options);
    };

    initUnitySection();
  </script>
</body>
</html>
