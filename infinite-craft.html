<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infinite Craft — alex.fun</title>
  <link rel="icon" type="image/png" href="./clever1.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Nunito","Arial Rounded MT Bold",Arial,sans-serif;
      background:#fff;color:#1a1a1a;min-height:100vh;
      display:flex;flex-direction:column;overflow:hidden;height:100vh;
    }

    /* ── Top bar ── */
    .top-bar{
      display:flex;align-items:center;gap:10px;
      padding:12px 20px;
      border-bottom:1.5px solid #ebebeb;
      background:#fff;flex-shrink:0;
    }
    .top-bar h1{
      font-size:18px;font-weight:900;flex:1;
    }
    .top-bar h1 span{color:#888;font-weight:700;font-size:14px;margin-left:8px;}
    .btn{
      font-family:inherit;font-size:13px;font-weight:800;
      color:#1a1a1a;background:#fff;border:1.5px solid #d4d4d4;
      border-radius:100px;padding:7px 16px;cursor:pointer;
      transition:background .15s,border-color .15s,transform .12s;
      white-space:nowrap;
    }
    .btn:hover{background:#f5f5f5;border-color:#bbb;transform:translateY(-1px);}
    .btn:active{transform:translateY(0);}
    .btn-danger{border-color:#ffb3b3;color:#c00;}
    .btn-danger:hover{background:#fff5f5;border-color:#ff8080;}

    /* ── Main layout: sidebar + workspace ── */
    .layout{display:flex;flex:1;overflow:hidden;}

    /* Left: scrollable element grid */
    .sidebar{
      width:300px;flex-shrink:0;
      border-right:1.5px solid #ebebeb;
      overflow-y:auto;padding:14px;
      scrollbar-width:thin;scrollbar-color:#ddd transparent;
    }
    .sidebar::-webkit-scrollbar{width:4px;}
    .sidebar::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px;}
    .sidebar-label{
      font-size:10px;font-weight:800;letter-spacing:2.5px;
      text-transform:uppercase;color:#ccc;
      margin-bottom:10px;display:block;
    }
    .elements{display:flex;flex-wrap:wrap;gap:6px;}
    .el{
      display:inline-flex;align-items:center;gap:5px;
      background:#f7f7f7;border:1.5px solid #e8e8e8;
      border-radius:100px;padding:5px 12px;
      font-size:13px;font-weight:800;cursor:pointer;
      transition:background .15s,border-color .15s,transform .1s;
      user-select:none;
    }
    .el:hover{background:#f0f0f0;border-color:#ccc;transform:translateY(-1px);}
    .el.selected{
      background:#1a1a1a;color:#fff;border-color:#1a1a1a;
    }
    .el.new-flash{animation:newFlash .6s ease both;}
    @keyframes newFlash{
      0%{transform:scale(0.7);opacity:0;}
      60%{transform:scale(1.12);}
      100%{transform:scale(1);opacity:1;}
    }

    /* Right: workspace */
    .workspace{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:30px;gap:20px;
    }

    .combine-area{
      display:flex;align-items:center;gap:16px;
    }

    .slot{
      width:130px;height:80px;
      border:2px dashed #ddd;border-radius:16px;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:800;color:#ccc;
      transition:border-color .2s,background .2s;
      text-align:center;padding:8px;gap:4px;
      flex-direction:column;
    }
    .slot.filled{
      border-style:solid;border-color:#e0e0e0;
      background:#f7f7f7;color:#1a1a1a;
    }
    .slot .slot-emoji{font-size:26px;}
    .slot .slot-name{font-size:12px;font-weight:800;}

    .plus-sign{font-size:28px;color:#ccc;font-weight:900;}

    .result-box{
      min-width:220px;height:80px;
      border:2px solid #e0e0e0;border-radius:16px;
      background:#fafafa;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:800;color:#aaa;
      text-align:center;padding:12px;gap:8px;
      flex-direction:column;
    }
    .result-box.has-result{
      border-color:#1a1a1a;background:#fff;color:#1a1a1a;
    }
    .result-box.new-discovery{
      border-color:#ffc107;background:#fffbea;
    }
    .result-box .res-emoji{font-size:30px;}
    .result-box .res-name{font-size:14px;font-weight:900;}
    .result-box .res-new{
      font-size:10px;font-weight:800;letter-spacing:1.5px;
      text-transform:uppercase;color:#ffa000;
    }

    .hint{
      font-size:13px;color:#bbb;font-weight:700;
      text-align:center;max-width:320px;line-height:1.5;
    }

    /* Toast */
    #toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      background:#1a1a1a;color:#fff;border-radius:100px;
      padding:10px 22px;font-size:13px;font-weight:800;
      opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
      white-space:nowrap;z-index:999;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @media(max-width:640px){
      .sidebar{width:100%;max-height:40vh;border-right:none;border-bottom:1.5px solid #ebebeb;}
      .layout{flex-direction:column;}
      .combine-area{flex-wrap:wrap;justify-content:center;}
    }
  </style>
</head>

["Harmony","Nature","🌿","Eden"],
["Harmony","Human","🌈","Utopia"],
["Atlantis","Ocean","🌊","Lost City"],
["Atlantis","Magic","🔮","Sunken Magic"],
["Eden","Human","🍎","Temptation"],
["Olympus","God","⛰️","Mount Olympus"],
["God","Lightning","⚡","Zeus"],
["God","Ocean","🌊","Poseidon"],
["God","Death","💀","Hades"],
["God","Fire","🔥","Prometheus"],
["God","Sun","☀️","Apollo"],
["God","Love","❤️","Aphrodite"],
["God","War","⚔️","Ares"],
["God","Wisdom","🦉","Athena"],
["Heaven","Cloud","🌤️","Paradise"],
["Heaven","Music","🎵","Choir"],
["Hell","Ice","❄️","Frozen Hell"],
["Hell","Human","😈","Damnation"],
["Afterlife","Human","👼","Reincarnation"],
["Utopia","Human","🌈","Perfect Society"],
["Dystopia","Human","☠️","Dark Future"],
["Future","Human","🔮","Prophet"],
["Future","Technology","💡","Innovation"],
["Past","Human","📚","Historian"],
["Past","Technology","🏛️","Archaeology"],
];

// ─────────────────────────────────────────────
//  Build lookup map
// ─────────────────────────────────────────────
const COMBO_MAP = {};
RECIPES.forEach(([a, b, emoji, name]) => {
  const key = [a, b].sort().join("|");
  if (!COMBO_MAP[key]) COMBO_MAP[key] = { emoji, name };
});

function combine(a, b) {
  return COMBO_MAP[[a, b].sort().join("|")] || null;
}

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
const STARTERS = [
  { emoji:"🌍", name:"Earth" },
  { emoji:"🔥", name:"Fire" },
  { emoji:"💧", name:"Water" },
  { emoji:"💨", name:"Wind" },
];
const SAVE_KEY = "infinitecraft_discovered";

function loadDiscovered() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveDiscovered(arr) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(arr)); } catch {}
}

let discovered = []; // [{emoji, name, isNew}]

function initDiscovered() {
  const saved = loadDiscovered();
  if (saved && saved.length >= 4) {
    discovered = saved.map(d => ({ ...d, isNew: false }));
  } else {
    discovered = STARTERS.map(s => ({ ...s, isNew: false }));
    saveDiscovered(discovered);
  }
}

function hasElement(name) {
  return discovered.some(d => d.name === name);
}

function addElement(emoji, name) {
  if (hasElement(name)) return false;
  discovered.push({ emoji, name, isNew: true });
  saveDiscovered(discovered.map(({ emoji, name }) => ({ emoji, name })));
  return true;
}

// ─────────────────────────────────────────────
//  UI State
// ─────────────────────────────────────────────
let selectedA = null;

// ─────────────────────────────────────────────
//  Render
// ─────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById("elementGrid");
  grid.innerHTML = "";
  discovered.forEach(({ emoji, name, isNew }) => {
    const el = document.createElement("button");
    el.className = "el" + (isNew ? " new-flash" : "");
    el.dataset.name = name;
    el.innerHTML = `<span>${emoji}</span>${name}`;
    el.addEventListener("click", () => onElementClick(name));
    grid.appendChild(el);
  });
  updateCounter();
  updateSlotHighlights();
}

function updateCounter() {
  document.getElementById("counter").textContent =
    `${discovered.length} discovered`;
}

function updateSlotHighlights() {
  document.querySelectorAll(".el").forEach(el => {
    el.classList.toggle("selected", el.dataset.name === selectedA);
  });
}

// ─────────────────────────────────────────────
//  Slot rendering
// ─────────────────────────────────────────────
function renderSlotA(name) {
  const slot = document.getElementById("slotA");
  if (!name) {
    slot.className = "slot";
    slot.innerHTML = "<span>Select an<br>element</span>";
    return;
  }
  const el = discovered.find(d => d.name === name);
  slot.className = "slot filled";
  slot.innerHTML = `<span class="slot-emoji">${el.emoji}</span><span class="slot-name">${name}</span>`;
}

function clearResult() {
  const rb = document.getElementById("resultBox");
  rb.className = "result-box";
  rb.innerHTML = "<span>?</span>";
}

function showResult(emoji, name, isNew) {
  const rb = document.getElementById("resultBox");
  rb.className = "result-box has-result" + (isNew ? " new-discovery" : "");
  rb.innerHTML = `
    <span class="res-emoji">${emoji}</span>
    <span class="res-name">${name}</span>
    ${isNew ? '<span class="res-new">✦ New discovery!</span>' : ""}
  `;
}

function showNoResult() {
  const rb = document.getElementById("resultBox");
  rb.className = "result-box";
  rb.innerHTML = `<span style="font-size:26px">🚫</span><span style="font-size:12px;color:#bbb">No combination</span>`;
}

// ─────────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

// ─────────────────────────────────────────────
//  Core click logic
// ─────────────────────────────────────────────
function onElementClick(name) {
  if (!selectedA) {
    // First selection
    selectedA = name;
    renderSlotA(name);
    clearResult();
    updateSlotHighlights();
  } else if (selectedA === name) {
    // Deselect
    selectedA = null;
    renderSlotA(null);
    clearResult();
    updateSlotHighlights();
  } else {
    // Combine!
    const result = combine(selectedA, name);
    const slotB = document.getElementById("slotB");
    const elB = discovered.find(d => d.name === name);

    slotB.className = "slot filled";
    slotB.innerHTML = `<span class="slot-emoji">${elB.emoji}</span><span class="slot-name">${name}</span>`;

    if (result) {
      const isNew = addElement(result.emoji, result.name);
      showResult(result.emoji, result.name, isNew);
      if (isNew) {
        showToast(`✦ Discovered: ${result.emoji} ${result.name}!`);
        // Mark all as not-new except the newly added
        discovered.forEach(d => { if (d.name !== result.name) d.isNew = false; });
      } else {
        discovered.forEach(d => { d.isNew = false; });
      }
      renderGrid();
    } else {
      showNoResult();
      discovered.forEach(d => { d.isNew = false; });
    }

    // Reset for next combo (keep slot B visible briefly)
    setTimeout(() => {
      slotB.className = "slot";
      slotB.innerHTML = "<span>Select an<br>element</span>";
    }, 1200);

    selectedA = null;
    renderSlotA(null);
    updateSlotHighlights();
  }
}

// ─────────────────────────────────────────────
//  Reset
// ─────────────────────────────────────────────
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Reset all discoveries? You'll start over with just the 4 base elements.")) return;
  localStorage.removeItem(SAVE_KEY);
  initDiscovered();
  selectedA = null;
  renderSlotA(null);
  clearResult();
  renderGrid();
  document.getElementById("slotB").className = "slot";
  document.getElementById("slotB").innerHTML = "<span>Select an<br>element</span>";
});

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
initDiscovered();
renderGrid();
</script>

</html>
