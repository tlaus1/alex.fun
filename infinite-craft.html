<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infinite Craft — alex.fun</title>
  <link rel="icon" type="image/png" href="./clever1.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Nunito","Arial Rounded MT Bold",Arial,sans-serif;
      background:#f0ede8;color:#1a1a1a;
      height:100vh;display:flex;flex-direction:column;overflow:hidden;
    }

    /* ── Top bar ── */
    .top-bar{
      display:flex;align-items:center;gap:10px;
      padding:10px 16px;background:#fff;
      border-bottom:1.5px solid #e0ddd8;flex-shrink:0;
      box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    .top-bar h1{
      font-size:17px;font-weight:900;flex:1;
    }
    .top-bar h1 span{color:#999;font-weight:700;font-size:13px;margin-left:6px;}
    .btn{
      font-family:inherit;font-size:13px;font-weight:800;
      color:#1a1a1a;background:#fff;border:1.5px solid #d0d0d0;
      border-radius:100px;padding:6px 14px;cursor:pointer;
      transition:background .13s,border-color .13s,transform .1s;white-space:nowrap;
    }
    .btn:hover{background:#f5f5f5;border-color:#bbb;transform:translateY(-1px);}
    .btn:active{transform:translateY(0);}
    .btn-danger{border-color:#ffb3b3;color:#c00;}
    .btn-danger:hover{background:#fff5f5;border-color:#ff8080;}

    /* ── Layout ── */
    .layout{display:flex;flex:1;overflow:hidden;}

    /* ── Sidebar ── */
    .sidebar{
      width:220px;flex-shrink:0;background:#fff;
      border-right:1.5px solid #e0ddd8;
      display:flex;flex-direction:column;overflow:hidden;
    }
    .sb-header{
      font-size:11px;font-weight:900;letter-spacing:2px;
      color:#bbb;padding:10px 14px 6px;text-transform:uppercase;flex-shrink:0;
      border-bottom:1px solid #f0ede8;
    }
    .sb-list{flex:1;overflow-y:auto;padding:8px;
      scrollbar-width:thin;scrollbar-color:#ddd transparent;}
    .sb-list::-webkit-scrollbar{width:4px;}
    .sb-list::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px;}
    .sb-item{
      display:flex;align-items:center;gap:7px;
      padding:6px 10px;border-radius:10px;cursor:pointer;
      font-size:13px;font-weight:800;
      transition:background .12s,transform .1s;
      border:1.5px solid transparent;user-select:none;
    }
    .sb-item:hover{background:#f5f3f0;transform:translateX(2px);}
    .sb-item:active{transform:translateX(0) scale(.97);}
    .sb-item.sb-new{
      background:#fffbea;border-color:#ffd700;
      animation:sbPop .4s ease;
    }
    @keyframes sbPop{0%{transform:scale(1.08)}50%{transform:scale(.97)}100%{transform:scale(1)}}
    .sb-emoji{font-size:18px;line-height:1;}
    .sb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* ── Workspace ── */
    .workspace{
      flex:1;position:relative;overflow:hidden;
      background:
        radial-gradient(circle at 20% 30%,rgba(255,200,100,.07) 0%,transparent 60%),
        radial-gradient(circle at 80% 70%,rgba(100,200,255,.06) 0%,transparent 60%),
        #f0ede8;
    }

    /* Grid dots background */
    .workspace::before{
      content:'';position:absolute;inset:0;
      background-image:radial-gradient(circle,#c8c4be 1px,transparent 1px);
      background-size:28px 28px;opacity:.45;pointer-events:none;
    }

    /* Hint text */
    .ws-hint{
      position:absolute;top:50%;left:50%;
      transform:translate(-50%,-50%);
      text-align:center;color:#bbb;font-size:14px;font-weight:800;
      pointer-events:none;line-height:1.7;max-width:280px;
      transition:opacity .3s;
    }
    .ws-hint .hint-icon{font-size:36px;display:block;margin-bottom:8px;}

    /* ── Workspace tile ── */
    .ws-tile{
      position:absolute;
      display:flex;align-items:center;gap:7px;
      padding:7px 12px 7px 9px;
      background:#fff;border:1.5px solid #e0ddd8;
      border-radius:12px;
      font-size:13px;font-weight:800;
      cursor:grab;user-select:none;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      transition:box-shadow .15s,border-color .15s;
      white-space:nowrap;
      touch-action:none;
    }
    .ws-tile:hover{box-shadow:0 4px 14px rgba(0,0,0,.13);border-color:#ccc;}
    .ws-tile.dragging{
      cursor:grabbing;opacity:.92;
      box-shadow:0 10px 32px rgba(0,0,0,.22);
      border-color:#888;z-index:999;
    }
    .ws-tile.tile-pop{animation:tilePop .35s ease;}
    @keyframes tilePop{
      0%{transform:scale(.6);opacity:0}
      70%{transform:scale(1.12)}
      100%{transform:scale(1);opacity:1}
    }
    .ws-tile.tile-shake{animation:tileShake .5s ease;}
    @keyframes tileShake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }
    .ws-tile.tile-new{background:#fffbea;border-color:#ffd700;}
    .tile-emoji{font-size:18px;line-height:1;}
    .tile-remove{
      font-size:10px;color:#ccc;margin-left:2px;cursor:pointer;
      opacity:0;transition:opacity .15s;font-weight:900;
    }
    .ws-tile:hover .tile-remove{opacity:1;}
    .tile-remove:hover{color:#f55;}

    /* ── Combo flash (merge indicator) ── */
    .combo-flash{
      position:absolute;pointer-events:none;
      font-size:22px;font-weight:900;color:#e67e00;
      text-shadow:0 0 12px rgba(255,180,0,.6);
      animation:floatUp 1s ease forwards;
      z-index:1000;
    }
    @keyframes floatUp{
      0%{opacity:1;transform:translateY(0) scale(1)}
      80%{opacity:.8}
      100%{opacity:0;transform:translateY(-50px) scale(.8)}
    }

    /* ── Toast ── */
    #toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      background:#1a1a1a;color:#fff;font-size:14px;font-weight:800;
      padding:10px 20px;border-radius:100px;
      pointer-events:none;opacity:0;
      transition:opacity .2s,transform .2s;z-index:9999;
      white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* Mobile */
    @media(max-width:600px){
      .sidebar{width:160px;}
      .sb-name{font-size:12px;}
    }
    @media(max-width:420px){
      .layout{flex-direction:column;}
      .sidebar{width:100%;max-height:35vh;border-right:none;border-bottom:1.5px solid #e0ddd8;}
      .sb-list{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:6px;}
      .sb-item{flex-shrink:0;}
    }
  </style>
</head>

<div class="top-bar">
  <button class="btn" onclick="location.href='./index.html'">← Back</button>

function getStarters(){ return [{emoji:"🌍",name:"Earth"},{emoji:"🔥",name:"Fire"},{emoji:"💧",name:"Water"},{emoji:"💨",name:"Wind"}]; }

function load(){
  try{ const s=localStorage.getItem(SAVE_KEY); if(s) discovered=JSON.parse(s); else discovered=getStarters(); }
  catch{ discovered=getStarters(); }
}
function save(){ localStorage.setItem(SAVE_KEY,JSON.stringify(discovered)); }

// ─────────────────────────────────────────────
//  Sidebar
// ─────────────────────────────────────────────
function renderSidebar(){
  const list = document.getElementById('sbList');
  const header = document.getElementById('sbHeader');
  header.textContent = discovered.length + ' discovered';
  document.getElementById('counter').textContent = discovered.length + ' discovered';

  list.innerHTML = '';
  for(const el of discovered){
    const div = document.createElement('div');
    div.className = 'sb-item' + (el.isNew ? ' sb-new' : '');
    div.innerHTML = `<span class="sb-emoji">${el.emoji}</span><span class="sb-name">${el.name}</span>`;
    div.title = `Add ${el.name} to the board`;
    div.addEventListener('click', ()=>addToBoard(el.emoji, el.name));
    list.appendChild(div);
  }
}

// ─────────────────────────────────────────────
//  Board — add tile
// ─────────────────────────────────────────────
function addToBoard(emoji, name){
  const rect = workspace.getBoundingClientRect();
  const tw = 140, th = 44;
  const x = 30 + Math.random() * Math.max(40, rect.width  - tw - 60);
  const y = 30 + Math.random() * Math.max(40, rect.height - th - 60);
  const id = nextId++;
  board.push({id,emoji,name,x,y});
  spawnTile(id);
  const hint = document.getElementById('wsHint');
  if(hint) hint.style.opacity='0';
}

function spawnTile(id, isNew=false){
  const item = board.find(i=>i.id===id);
  if(!item) return;

  const div = document.createElement('div');
  div.className = 'ws-tile' + (isNew?' tile-new':'');
  div.id = 'tile-'+id;
  div.dataset.id = id;
  div.style.left = item.x+'px';
  div.style.top  = item.y+'px';
  div.innerHTML  = `<span class="tile-emoji">${item.emoji}</span><span>${item.name}</span><span class="tile-remove" title="Remove">✕</span>`;

  div.querySelector('.tile-remove').addEventListener('click', e=>{
    e.stopPropagation();
    div.style.transition='opacity .2s';
    div.style.opacity='0';
    setTimeout(()=>{
      div.remove();
      board = board.filter(i=>i.id!==id);
    },200);
  });

  if(isNew) setTimeout(()=>div.classList.remove('tile-new'), 2000);
  workspace.appendChild(div);
  div.classList.add('tile-pop');
}

// ─────────────────────────────────────────────
//  Drag (pointer events)
// ─────────────────────────────────────────────
workspace.addEventListener('pointerdown', e=>{
  const tile = e.target.closest('.ws-tile');
  if(!tile || e.target.classList.contains('tile-remove')) return;

  const id   = parseInt(tile.dataset.id);
  const item = board.find(i=>i.id===id);
  if(!item) return;

  const wRect = workspace.getBoundingClientRect();
  dragging = {
    id, item, tile,
    ox: e.clientX - wRect.left - item.x,
    oy: e.clientY - wRect.top  - item.y
  };
  tile.classList.add('dragging');
  tile.setPointerCapture(e.pointerId);
  e.preventDefault();
});

workspace.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const wRect = workspace.getBoundingClientRect();
  const nx = e.clientX - wRect.left - dragging.ox;
  const ny = e.clientY - wRect.top  - dragging.oy;
  dragging.item.x = Math.max(0, Math.min(wRect.width  - 140, nx));
  dragging.item.y = Math.max(0, Math.min(wRect.height -  44, ny));
  dragging.tile.style.left = dragging.item.x+'px';
  dragging.tile.style.top  = dragging.item.y+'px';
  e.preventDefault();
},{passive:false});

workspace.addEventListener('pointerup', e=>{
  if(!dragging) return;
  const {id, tile} = dragging;
  tile.classList.remove('dragging');
  dragging = null;

  const otherId = findOverlap(id);
  if(otherId !== null) tryCombine(id, otherId);
});

// ─────────────────────────────────────────────
//  Overlap detection (centre-to-centre)
// ─────────────────────────────────────────────
function findOverlap(dragId){
  const el1 = document.getElementById('tile-'+dragId);
  if(!el1) return null;
  const r1 = el1.getBoundingClientRect();
  const cx1=(r1.left+r1.right)/2, cy1=(r1.top+r1.bottom)/2;

  for(const item of board){
    if(item.id===dragId) continue;
    const el2 = document.getElementById('tile-'+item.id);
    if(!el2) continue;
    const r2=el2.getBoundingClientRect();
    const cx2=(r2.left+r2.right)/2, cy2=(r2.top+r2.bottom)/2;
    if(Math.sqrt((cx1-cx2)**2+(cy1-cy2)**2) < 80) return item.id;
  }
  return null;
}

// ─────────────────────────────────────────────
//  Combine logic
// ─────────────────────────────────────────────
function tryCombine(idA, idB){
  const iA = board.find(i=>i.id===idA);
  const iB = board.find(i=>i.id===idB);
  if(!iA||!iB) return;

  const mx = (iA.x+iB.x)/2;
  const my = (iA.y+iB.y)/2;

  // Remove both from DOM + board
  document.getElementById('tile-'+idA)?.remove();
  document.getElementById('tile-'+idB)?.remove();
  board = board.filter(i=>i.id!==idA&&i.id!==idB);

  const result = combine(iA.name, iB.name);

  if(result){
    const newId = nextId++;
    board.push({id:newId, emoji:result.emoji, name:result.name, x:mx, y:my});
    spawnTile(newId);

    // Flash combo indicator
    const flash = document.createElement('div');
    flash.className = 'combo-flash';
    flash.textContent = result.emoji;
    flash.style.left = (mx+50)+'px';
    flash.style.top  = (my-10)+'px';
    workspace.appendChild(flash);
    flash.addEventListener('animationend',()=>flash.remove());

    const isNew = addDiscovered(result.emoji, result.name);
    if(isNew) showToast(`✦ New: ${result.emoji} ${result.name}!`);
  } else {
    // No combo — put both back, shake
    const nA = nextId++, nB = nextId++;
    board.push({id:nA, emoji:iA.emoji, name:iA.name, x:iA.x+12, y:iA.y+12});
    board.push({id:nB, emoji:iB.emoji, name:iB.name, x:iB.x-12, y:iB.y-12});
    spawnTile(nA); spawnTile(nB);
    const tA=document.getElementById('tile-'+nA), tB=document.getElementById('tile-'+nB);
    tA?.classList.add('tile-shake'); tB?.classList.add('tile-shake');
    setTimeout(()=>{ tA?.classList.remove('tile-shake'); tB?.classList.remove('tile-shake'); }, 550);
    showToast('No recipe for those two 🤷');
  }
}

function addDiscovered(emoji, name){
  if(discovered.find(d=>d.name===name)) return false;
  // Clear old "isNew" flags
  discovered.forEach(d=>d.isNew=false);
  discovered.push({emoji, name, isNew:true});
  save();
  renderSidebar();
  return true;
}

// ─────────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────────
let toastT=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show';
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.className='',2600);
}

// ─────────────────────────────────────────────
//  Controls
// ─────────────────────────────────────────────
document.getElementById('clearBoardBtn').addEventListener('click',()=>{
  board=[];
  workspace.querySelectorAll('.ws-tile').forEach(t=>t.remove());
  const hint=document.getElementById('wsHint');
  if(hint) hint.style.opacity='1';
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('Reset ALL discoveries and start over?')) return;
  localStorage.removeItem(SAVE_KEY);
  discovered=getStarters();
  board=[]; nextId=0;
  workspace.querySelectorAll('.ws-tile').forEach(t=>t.remove());
  const hint=document.getElementById('wsHint');
  if(hint) hint.style.opacity='1';
  renderSidebar();
});

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
load();
renderSidebar();
</script>
</body>
</html>
