<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Retro Bowl Storage Debug</title>
</head>
<body>
  <pre id="out"></pre>
  <script>
    const matches = [];
    for (let index = 0; index < localStorage.length; index += 1) {
      const key = localStorage.key(index);
      if (/retro|save|uniform/i.test(key)) {
        matches.push(key);
      }
    }
    document.getElementById("out").textContent = matches.sort().join("\n");
  </script>
</body>
</html>
