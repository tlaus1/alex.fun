<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Baseball — alex.fun</title>
  <link rel="icon" type="image/png" href="./clever1.png">
  <script src="./cover-profiles.js"></script>
  <style>
    :root {
      --status-h: 24px;
      --bg: #b9202d;
      --panel: rgba(18, 33, 67, .85);
      --fg: #fff8e7;
      --muted: #f5e4c3;
      --border: rgba(255,255,255,.22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    /* Cover overlay (Backspace) */
    #coverOverlay {
      position: fixed; inset: 0; z-index: 10000;
      background: #fff; opacity: 0; pointer-events: none;
      transition: opacity .45s cubic-bezier(.4,0,.2,1); cursor: pointer;
    }
    #coverOverlay.show { opacity: 1; pointer-events: auto; }
    #coverOverlay img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .topbar {
      position: fixed; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      pointer-events: none; z-index: 20;
    }
    .actions { display: flex; gap: 8px; pointer-events: auto; }
    .title {
      pointer-events: none; max-width: 44vw; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--panel); backdrop-filter: blur(12px);
      box-shadow: 0 8px 22px rgba(0,0,0,.32);
      font-size: 12px; font-weight: 900; color: var(--fg);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn {
      appearance: none; border: 1px solid var(--border); border-radius: 999px;
      background: var(--panel); color: var(--fg); padding: 8px 12px;
      font: inherit; font-size: 12px; font-weight: 900; cursor: pointer;
      backdrop-filter: blur(12px); box-shadow: 0 8px 22px rgba(0,0,0,.32);
    }
    .btn:hover { background: rgba(28,47,90,.95); }

    .game-shell {
      position: fixed;
      inset: 0 0 var(--status-h) 0;
      background: #b9202d;
      display: flex; align-items: center; justify-content: center;
    }
    iframe {
      width: 100%; height: 100%;
      border: 0; display: block;
      background: #b9202d;
    }

    #statusBar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--status-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      background: #122143;
      border-top: 1px solid rgba(255,255,255,.14);
      font-size: 11px; font-weight: 800; color: var(--muted);
      z-index: 30;
    }
    #statusBar .sb-cover { cursor: pointer; user-select: none; }
    #statusBar .sb-cover:hover { color: var(--fg); }

    @media (max-width: 640px) {
      .topbar { top: 8px; left: 8px; right: 8px; }
      .title { display: none; }
      .btn { padding: 7px 10px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="actions">
      <button class="btn" id="backBtn" type="button">Back</button>
    </div>
    <div class="title">Google Baseball</div>
    <div class="actions">
      <button class="btn" id="fullscreenBtn" type="button">Fullscreen</button>
    </div>
  </div>

  <main class="game-shell" id="gameShell">
    <iframe
      id="gameFrame"
      src="https://elgoog.im/doodle-baseball/"
      title="Google Baseball"
      allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
      referrerpolicy="no-referrer">
    </iframe>
  </main>

  <div id="coverOverlay" aria-hidden="true">
    <img data-cover-image alt="Cover">
  </div>

  <div id="statusBar">
    <span>Google Baseball</span>
    <span class="sb-cover" id="coverHint">Backspace Cover Image</span>
  </div>

  <script>
    const gameShell = document.getElementById('gameShell');
    const gameFrame = document.getElementById('gameFrame');

    document.getElementById('backBtn').addEventListener('click', () => {
      location.href = './index.html';
    });

    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
      try {
        if (gameFrame.requestFullscreen) await gameFrame.requestFullscreen();
        else if (gameShell.requestFullscreen) await gameShell.requestFullscreen();
      } catch (e) {
        console.log('Fullscreen failed:', e);
      }
    });

    const coverOverlay = document.getElementById('coverOverlay');
    function toggleCover() {
      const showing = coverOverlay.classList.toggle('show');
      coverOverlay.setAttribute('aria-hidden', String(!showing));
    }
    coverOverlay.addEventListener('click', toggleCover);
    document.getElementById('coverHint').addEventListener('click', toggleCover);
    document.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        toggleCover();
      }
    });
  </script>
</body>
</html>
