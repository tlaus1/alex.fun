<!DOCTYPE html>
<!-- Ultimate Game Stash file -->
<html lang="en-us">
<head>
  <!-- alex.fun helpers — must come BEFORE <base> so they resolve to our origin -->
  <script src="./cover-profiles.js"></script>
  <script src="./supabase-config.js"></script>
  <script defer src="./music-bridge.js"></script>
  <script defer src="./social-bar.js?v=3"></script>
  <link rel="icon" type="image/png" href="./clever1.png">

  <base href="https://cdn.statically.io/gh/gn-math/assets@main/198/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Slope</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    :root { --status-h: 26px; --panel: rgba(0,30,0,.82); --fg: #e7ffe9; --border: rgba(60,255,90,.35); }

    html, body {
      margin: 0; padding: 0;
      overflow: hidden;
      height: 100%; width: 100%;
      background: #000;
    }
    #unity-container, #gameContainer {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
    }

    /* ── alex.fun chrome ── */
    .alex-topbar {
      position: fixed; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      pointer-events: none; z-index: 9000;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .alex-actions { display: flex; gap: 8px; pointer-events: auto; }
    .alex-btn {
      appearance: none; border: 1.5px solid var(--border); border-radius: 999px;
      background: var(--panel); color: var(--fg); padding: 8px 14px;
      font-family: inherit; font-size: 12px; font-weight: 900;
      cursor: pointer; backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px rgba(0,0,0,.45);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .alex-btn:hover { background: rgba(0,60,10,.95); border-color: #44ff66; color: #b6ffc1; }

    #alexStatusBar {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--status-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      background: #000800; border-top: 1px solid rgba(60,255,90,.3);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 11px; font-weight: 800; color: rgba(120,255,150,.8);
      z-index: 9100;
    }
    #alexStatusBar .sb-cover { cursor: pointer; user-select: none; }
    #alexStatusBar .sb-cover:hover { color: #d6ffdf; }

    /* Cover overlay (Backspace) — sits above the music pill (z-index 10030) */
    #coverOverlay {
      position: fixed; inset: 0; z-index: 11000;
      background: #fff; opacity: 0; pointer-events: none;
      transition: opacity .45s cubic-bezier(.4,0,.2,1); cursor: pointer;
    }
    #coverOverlay.show { opacity: 1; pointer-events: auto; }
    #coverOverlay img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  </style>

  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    function mergeFiles(fileParts) {
      return new Promise((resolve, reject) => {
        let buffers = [];
        function fetchPart(index) {
          if (index >= fileParts.length) {
            let mergedBlob = new Blob(buffers);
            let mergedFileUrl = URL.createObjectURL(mergedBlob);
            resolve(mergedFileUrl);
            return;
          }
          fetch(fileParts[index]).then(r => r.arrayBuffer()).then(data => {
            buffers.push(data);
            fetchPart(index + 1);
          }).catch(reject);
        }
        fetchPart(0);
      });
    }
    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }
    window.addEventListener('resize', resizeGameContainer);
    function resizeGameContainer() {
      const container = document.getElementById('gameContainer');
      if (container) {
        container.style.width  = window.innerWidth  + "px";
        container.style.height = window.innerHeight + "px";
      }
    }
    window.onload = function () {
      resizeGameContainer();
      Promise.all([
        mergeFiles(getParts(
          "https://cdn.statically.io/gh/gn-math/assets@main/198/Build/WEB1.2.1.data.unityweb",
          1, 2
        ))
      ]).then(([dataUrl]) => {
        let json = {
          companyName: "Slope Plus",
          productName: "Slope Plus",
          dataUrl: dataUrl,
          wasmCodeUrl:      "https://cdn.statically.io/gh/gn-math/assets@main/198/Build/WEB1.2.1.wasm.code.unityweb",
          wasmFrameworkUrl: "https://cdn.statically.io/gh/gn-math/assets@main/198/Build/WEB1.2.1.wasm.framework.unityweb",
          TOTAL_MEMORY: 268435456,
          graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
          webglContextAttributes: { preserveDrawingBuffer: false },
          splashScreenStyle: "Dark",
          backgroundColor: "#000000"
        };
        let blob = new Blob([JSON.stringify(json)], { type: 'application/json' });
        let blobUrl = URL.createObjectURL(blob);
        UnityLoader.instantiate("gameContainer", json, {
          onProgress: UnityProgress,
          url: blobUrl
        });
      });
    };
  </script>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>

  <!-- alex.fun top bar -->
  <div class="alex-topbar">
    <div class="alex-actions">
      <button class="alex-btn" id="alexBackBtn" type="button">Back</button>
    </div>
    <div class="alex-actions">
      <button class="alex-btn" id="alexFullscreenBtn" type="button">Fullscreen</button>
    </div>
  </div>

  <!-- alex.fun cover overlay -->
  <div id="coverOverlay" aria-hidden="true">
    <img data-cover-image alt="Cover">
  </div>

  <!-- alex.fun status bar -->
  <div id="alexStatusBar">
    <span>Slope</span>
    <span class="sb-cover" id="alexCoverHint">Backspace Cover Image</span>
  </div>

  <!-- alex.fun chrome JS -->
  <script>
    document.getElementById('alexBackBtn').addEventListener('click', function () {
      window.location.href = new URL('index.html', window.location.href).href;
    });

    var alexFsBtn = document.getElementById('alexFullscreenBtn');
    alexFsBtn.addEventListener('click', async function () {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          alexFsBtn.textContent = 'Exit Fullscreen';
        } else {
          await document.exitFullscreen();
          alexFsBtn.textContent = 'Fullscreen';
        }
      } catch (e) { console.log('Fullscreen failed:', e); }
    });
    document.addEventListener('fullscreenchange', function () {
      alexFsBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    });

    var coverOverlay = document.getElementById('coverOverlay');
    function toggleCover() {
      var showing = coverOverlay.classList.toggle('show');
      coverOverlay.setAttribute('aria-hidden', String(!showing));
    }
    coverOverlay.addEventListener('click', toggleCover);
    document.getElementById('alexCoverHint').addEventListener('click', toggleCover);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Backspace' || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      toggleCover();
    }, true);
  </script>
</body>
</html>
