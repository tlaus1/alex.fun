<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clever | Portal</title>
  <link rel="icon" type="image/png" href="./clever1.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      background: #05070d;
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-shell {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 30% 18%, rgba(45,212,191,0.18), transparent 28%),
        linear-gradient(135deg, #05070d 0%, #0f172a 58%, #042f2e 100%);
    }

    .game-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .top-controls,
    .bottom-hint {
      position: fixed;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(8,13,24,0.74);
      color: #fff;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
      backdrop-filter: blur(14px);
    }

    .top-controls {
      top: 14px;
      left: 14px;
      border-radius: 999px;
      padding: 8px;
    }

    .bottom-hint {
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      border-radius: 16px;
      padding: 10px 15px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .focus-warning {
      position: fixed;
      left: 50%;
      top: 14px;
      z-index: 51;
      transform: translateX(-50%);
      max-width: min(520px, calc(100vw - 24px));
      border: 1px solid rgba(255,77,77,0.45);
      border-radius: 16px;
      padding: 10px 14px;
      background: rgba(28,10,10,0.82);
      color: #fff;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      backdrop-filter: blur(14px);
    }
    .focus-warning.hidden { display: none; }

    .keycap {
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.12);
      padding: 5px 9px;
      color: #ff4d4d;
      font-weight: 900;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      color: #fff;
      background: rgba(255,255,255,0.12);
      font-weight: 800;
      cursor: pointer;
    }
    .btn:hover { background: rgba(255,255,255,0.2); }

    #idlePhoto {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #000;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.45s ease;
    }
    #idlePhoto.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #idlePhoto.no-transition { transition: none; }
    #idlePhoto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    @media (max-width: 640px) {
      .top-controls { top: 8px; left: 8px; }
      .btn { padding: 8px 11px; font-size: 12px; }
      .bottom-hint { width: calc(100% - 18px); justify-content: center; bottom: 8px; }
      .focus-warning { top: 58px; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <iframe
      id="gameFrame"
      class="game-frame"
      title="Slope"
      src="https://sz-games.github.io/slope/"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </main>

  <div class="top-controls">
    <button class="btn" type="button" onclick="location.href='./index.html'">Back</button>
    <button class="btn" id="fullscreenBtn" type="button">Fullscreen</button>
    <button class="btn" id="coverBtn" type="button">Cover</button>
  </div>

  <button class="bottom-hint" id="coverHint" type="button"><span class="keycap">Backspace</span> = Cover Photo</button>
  <div class="focus-warning hidden" id="focusWarning">If Slope has keyboard focus, click Cover or this bottom bar. Remote iframes hide Backspace from this page.</div>

  <div id="idlePhoto" class="hidden" aria-hidden="true">
    <img src="./cleverpage.png" alt="Idle screen" />
  </div>

  <script>
    const idlePhoto = document.getElementById("idlePhoto");
    const gameFrame = document.getElementById("gameFrame");
    const focusWarning = document.getElementById("focusWarning");

    function showIdle(instant = false) {
      focusWarning.classList.add("hidden");
      if (instant) {
        idlePhoto.classList.add("no-transition");
        idlePhoto.classList.remove("hidden");
        requestAnimationFrame(() => requestAnimationFrame(() => {
          idlePhoto.classList.remove("no-transition");
        }));
        return;
      }
      idlePhoto.classList.remove("hidden");
    }

    function hideIdle() {
      idlePhoto.classList.add("hidden");
      document.body.focus({ preventScroll: true });
    }

    ["mousemove", "mousedown", "touchstart", "click", "wheel"].forEach(evt => {
      window.addEventListener(evt, hideIdle, { passive: true });
    });

    function handleCoverKey(e) {
      if (e.key === "Backspace") {
        e.preventDefault();
        e.stopPropagation();
        showIdle(true);
        return;
      }
      hideIdle();
    }

    document.body.tabIndex = -1;
    document.body.focus({ preventScroll: true });

    window.addEventListener("keydown", handleCoverKey, true);
    document.addEventListener("keydown", handleCoverKey, true);
    document.body.addEventListener("keydown", handleCoverKey, true);

    document.getElementById("coverBtn").addEventListener("click", e => {
      e.stopPropagation();
      showIdle(true);
    });
    document.getElementById("coverHint").addEventListener("click", e => {
      e.stopPropagation();
      showIdle(true);
    });

    window.addEventListener("blur", () => {
      setTimeout(() => {
        if (document.activeElement === gameFrame) {
          focusWarning.classList.remove("hidden");
        }
      }, 50);
    });

    window.addEventListener("focus", () => {
      focusWarning.classList.add("hidden");
    });

    document.getElementById("fullscreenBtn").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await gameFrame.requestFullscreen();
        else await document.exitFullscreen();
      } catch (err) {
        console.log("Fullscreen blocked:", err);
      }
    });
  </script>
</body>
</html>
